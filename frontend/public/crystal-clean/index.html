<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crystal Clean Service Hub</title>
<link rel="icon" href="/crystal-clean/logo.webp">
<style>
:root {
  --navy: #0b2c4d; --blue: #0a5c9e; --sky: #e8f3fb; --green: #2e9a46; --green-bg: #e9f6ec;
  --amber: #b26a00; --amber-bg: #fff4e0; --red: #c0352b; --red-bg: #fdecea; --violet: #5b3fb5; --violet-bg: #efeafd; --purple: #6e4ff6; --purple-bg: #efeafe;
  --ink: #17212b; --muted: #5d6b78; --line: #e3e8ee; --bg: #f5f7fa; --card: #fff;
  --radius: 14px; --shadow: 0 1px 2px rgba(16,32,48,.06), 0 4px 16px rgba(16,32,48,.05);
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Arial, sans-serif; color: var(--ink); background: var(--bg); }
button { font: inherit; cursor: pointer; }
a { color: var(--blue); }
.top { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line); }
.top-in { max-width: 1280px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.brand img { height: 40px; width: auto; display: block; }
.brand span { color: var(--muted); border-left: 1px solid var(--line); padding-left: 12px; font-weight: 600; white-space: nowrap; }
.spacer { flex: 1; }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { white-space: nowrap; border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 13px; }
.seg button.on { background: var(--navy); color: #fff; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--navy); display: grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--sky); }
.icon-btn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.who { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 4px; background: #fff; }
.av { width: 30px; height: 30px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.av.it { background: var(--violet); }
.who b { font-size: 13px; display: block; line-height: 1.1; } .who small { color: var(--muted); font-size: 11px; }
main { max-width: 1280px; margin: 0 auto; padding: 24px 20px 48px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
h1 { font-size: 28px; margin: 0 0 4px; color: var(--navy); letter-spacing: -.3px; }
h2 { font-size: 15px; margin: 0 0 12px; color: var(--navy); }
h3 { font-size: 14px; margin: 0 0 8px; color: var(--navy); }
.sub { color: var(--muted); margin: 0 0 18px; }
.pad { padding: 20px; }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0; margin: 0; }
.pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; white-space: nowrap; display: inline-block; }
.pill.ok { background: var(--green-bg); color: var(--green); } .pill.run { background: var(--sky); color: var(--blue); }
.pill.warn { background: var(--amber-bg); color: var(--amber); } .pill.bad { background: var(--red-bg); color: var(--red); }
.pill.grey { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.btn { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.go { background: var(--green); border-color: var(--green); color: #fff; }
.btn.no { color: var(--red); }
.hero { padding: 28px; background: linear-gradient(135deg, #0b2c4d, #0a5c9e); color: #fff; border: 0; }
.hero h1 { color: #fff; } .hero .sub { color: #cfe3f3; }
.ask { display: flex; gap: 8px; background: #fff; border-radius: 12px; padding: 6px; }
.ask input { flex: 1; border: 0; outline: 0; font: inherit; font-size: 16px; padding: 10px 12px; min-width: 0; }
.ask button { border: 0; background: var(--green); color: #fff; border-radius: 9px; padding: 0 20px; font-weight: 600; }
.ask button:disabled { opacity: .6; cursor: default; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.chip { border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.1); color: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.chip:hover { background: rgba(255,255,255,.2); }
.thread { margin-top: 14px; display: grid; gap: 8px; }
.msg { max-width: 80%; padding: 9px 13px; border-radius: 12px; font-size: 14px; }
.msg.me { justify-self: end; background: rgba(255,255,255,.18); color: #fff; }
.msg.bot { background: #fff; color: var(--ink); justify-self: start; }
.msg.typing { color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1.6fr; gap: 20px; margin-top: 20px; align-items: start; }
.alert { border-radius: 12px; padding: 14px; margin-bottom: 10px; border: 1px solid; }
.alert.high { background: var(--red-bg); border-color: #f4c7c2; }
.alert.medium { background: var(--amber-bg); border-color: #f3dcb2; }
.alert b { display: block; margin-bottom: 2px; }
.alert p { margin: 0 0 10px; font-size: 14px; color: #3a4652; }
.alert .row { display: flex; gap: 8px; }
.req { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
.req-h { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.req-h b { font-size: 15px; } .req-h small { color: var(--muted); white-space: nowrap; }
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 12px 0 10px; }
.steps div { text-align: center; font-size: 12px; color: var(--muted); line-height: 1.3; }
.steps i { display: block; height: 6px; border-radius: 3px; background: var(--line); margin-bottom: 5px; }
.steps .on i { background: var(--green); } .steps .now i { background: var(--blue); animation: pulse 1.2s infinite; }
.steps .warn i { background: var(--amber); }
.steps .on, .steps .now, .steps .warn { color: var(--ink); font-weight: 600; }
@keyframes pulse { 50% { opacity: .45; } }
.journey { list-style: none; margin: 0; padding: 0; border-top: 1px dashed var(--line); padding-top: 8px; }
.journey li { display: flex; gap: 10px; font-size: 14px; padding: 3px 0; color: #3a4652; }
.journey li time { color: var(--muted); font-size: 12px; min-width: 62px; padding-top: 2px; }
.journey li:last-child { color: var(--ink); font-weight: 600; }
details.more summary { cursor: pointer; color: var(--blue); font-size: 13px; margin-top: 4px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
.kpi { padding: 16px 18px; }
.kpi small { color: var(--muted); font-size: 13px; } .kpi b { display: block; font-size: 28px; color: var(--navy); }
.kpi.attn { border-color: #f3dcb2; background: var(--amber-bg); }
.banner { display: flex; align-items: center; gap: 12px; justify-content: space-between; border: 1px solid #f3dcb2; background: var(--amber-bg); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
.tk { display: block; cursor: pointer; width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
.tk.sel { border-color: var(--blue); box-shadow: 0 0 0 3px var(--sky); }
.tk-h { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.tk-h a { font-weight: 700; text-decoration: none; } .tk-h a:hover { text-decoration: underline; }
.tk p { margin: 4px 0 0; font-size: 14px; } .tk small { color: var(--muted); }
.quote { background: var(--bg); border-radius: 10px; padding: 10px 14px; margin: 10px 0 16px; font-size: 14px; }
.quote small { display: block; color: var(--muted); font-size: 12px; }
.panel { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.panel-h { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; margin-bottom: 8px; }
.panel-h h3 { margin: 0; } .panel-h small { color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.fact { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--muted); }
.fact b { display: block; font-size: 16px; color: var(--navy); }
.fact.bad b { color: var(--red); } .fact.good b { color: var(--green); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); padding: 6px 8px; }
.tbl td { border-bottom: 1px solid var(--line); padding: 6px 8px; }
.tbl tr.marker td { background: var(--sky); color: var(--blue); font-weight: 600; }
.tbl-wrap { overflow-x: auto; }
.logbox { background: #0f1b27; color: #c9d6e2; border-radius: 10px; padding: 10px 12px; font: 12px/1.5 Consolas, "Cascadia Mono", monospace; overflow: auto; white-space: pre; max-height: 230px; }
.logbox .e { color: #ff8a80; } .logbox .w { color: #ffd180; } .logbox .i { color: #a5d6a7; }
.chart { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.stack { display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: var(--line); }
.stack span { height: 100%; }
.cmp { display: grid; grid-template-columns: 60px 1fr 60px; gap: 8px; align-items: center; font-size: 13px; margin: 6px 0; }
.pipe { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
.node { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 6px; text-align: center; font-size: 11.5px; line-height: 1.25; min-height: 74px; }
.node:hover { border-color: var(--blue); }
.node .ic { width: 24px; height: 24px; border-radius: 50%; margin: 0 auto 5px; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--line); color: var(--muted); }
.node b { display: block; font-size: 12px; color: var(--ink); }
.node small { color: var(--muted); font-size: 10.5px; }
.node.done .ic { background: var(--green); color: #fff; }
.node.running { border-color: var(--blue); box-shadow: 0 0 0 3px var(--sky); }
.node.running .ic { background: var(--blue); color: #fff; animation: pulse 1s infinite; }
.node.waiting { border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-bg); }
.node.waiting .ic { background: var(--amber); color: #fff; animation: pulse 1s infinite; }
.node.warn .ic { background: var(--amber); color: #fff; } .node.fail .ic { background: var(--red); color: #fff; }
.node.skipped, .node.na { opacity: .5; }
.node.sel { outline: 2px solid var(--navy); outline-offset: 1px; }
.stage { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 18px; }
.stage-h { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.stage-h h3 { margin: 0; font-size: 16px; }
.stage-h p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.eng { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; }
.eng.ai { background: var(--violet-bg); color: var(--violet); } .eng.rules { background: var(--amber-bg); color: var(--amber); }
.eng.tool { background: var(--sky); color: var(--blue); } .eng.alert { background: var(--red-bg); color: var(--red); }
.eng.human { background: var(--green-bg); color: var(--green); } .eng.policy { background: var(--bg); color: var(--muted); }
.approve-box { margin-top: 12px; border: 1px solid #f3dcb2; background: var(--amber-bg); border-radius: 10px; padding: 12px 14px; }
.approve-box .row { display: flex; gap: 8px; margin-top: 8px; }
.kv { display: grid; grid-template-columns: 190px 1fr; gap: 4px 14px; font-size: 13.5px; margin-top: 10px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-word; }
.kv ul { margin: 0; padding-left: 18px; }
.sec { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 14px 0 0; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tools span { font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
.note { border-left: 3px solid var(--blue); background: #f8fafc; padding: 10px 12px; border-radius: 0 8px 8px 0; margin-bottom: 8px; font-size: 13px; white-space: pre-wrap; }
.note.c { border-color: var(--green); }
.note small { display: block; color: var(--muted); margin-bottom: 4px; white-space: normal; }
details.notes summary { cursor: pointer; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
.side { display: grid; gap: 20px; margin-top: 20px; grid-template-columns: 1fr 1.3fr 1fr; }
.bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin: 8px 0 6px; }
.bar i { display: block; height: 100%; background: var(--green); transition: width .6s; }
.bar.hot i { background: var(--red); } .bar.warm i { background: var(--amber); }
.sys { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.sys:last-child { border: 0; } .sys span { color: var(--muted); text-align: right; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; }
.dot.off { background: var(--amber); }
details.demo summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.demo-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 90vw; }
.toast.on { opacity: 1; }
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 0 24px; }
@media (max-width: 1100px) { .side { grid-template-columns: 1fr; } }
@media (max-width: 860px) {
  .grid2 { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .pipe { grid-template-columns: repeat(2, 1fr); }
  .brand span, .who small, .who span b { display: none; }
  .top-in { padding: 10px 16px; gap: 8px; } main { padding: 16px; }
  .brand img { height: 30px; }
  .msg { max-width: 92%; }
  .kv { grid-template-columns: 1fr; } .kv dt { margin-top: 6px; }
  .steps div { font-size: 10.5px; }
}
.kpis6 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpis7 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stages5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 10px; }
.stage-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.stage-card b { font-size: 13px; color: var(--navy); }
/* AURA predictive-intelligence shell: navy sidebar for the IT view only */
.shell { display: flex; align-items: flex-start; }
.shell > #main { flex: 1 1 auto; min-width: 0; }
.sidebar { display: none; }
.shell.itview .sidebar { display: block; width: 232px; flex: none; background: var(--navy); min-height: calc(100vh - 62px); position: sticky; top: 62px; padding: 16px 0 24px; }
.shell.itview main#main { max-width: none; margin: 0; flex: 1; min-width: 0; padding: 24px 24px 48px; }
.side-grp { padding: 16px 18px 6px; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: #8fa6bd; }
.side-link { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: #cfe0ef; padding: 9px 18px; font-size: 13.5px; font-weight: 600; border-left: 3px solid transparent; }
.side-link:hover { background: rgba(255,255,255,.07); color: #fff; }
.side-link.on { background: rgba(255,255,255,.1); color: #fff; border-left-color: var(--purple); }
.kpi.click { cursor: pointer; }
.pi2-backdrop { position: fixed; inset: 0; background: rgba(10,20,35,.4); z-index: 50; }
.pi2-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 92vw); background: #fff; box-shadow: -8px 0 24px rgba(10,20,35,.2); overflow: auto; padding: 20px; z-index: 51; }
.pipeline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
.pipeline .pstage { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); background: #f1f3f6; border-radius: 999px; padding: 4px 11px 4px 6px; }
.pipeline .pstage.done { color: var(--green); background: var(--green-bg); }
.pipeline .pstage i { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 9.5px; font-style: normal; border: 1.5px solid currentColor; flex: none; }
.pipeline .arrow { color: #b8c1cc; font-size: 12px; }
.pi-tabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 18px; }
.pi-tab { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 12px; color: var(--ink); box-shadow: var(--shadow); }
.pi-tab:hover { border-color: #b9c6d4; }
.pi-tab b { display: block; font-size: 13px; }
.pi-tab span { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.3; }
.pi-tab span i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.pi-tab.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.pi-tab.on span { color: #cfe0ef; }
.pi-body h1 { font-size: 20px; }
.pi-body > .sub:first-of-type { margin-bottom: 14px; }
.sig-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.sig-card { border-top: 3px solid; cursor: pointer; padding: 14px 16px; }
.sig-card:hover { box-shadow: 0 0 0 3px var(--sky); }
.fac-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.fac-bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 10px 0 6px; }
.fac-bar i { display: block; height: 100%; border-radius: 3px; }
.wt { font: 11px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--muted); white-space: nowrap; }
.eyebrow { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.notif { border-left: 4px solid; padding: 16px 18px; margin-bottom: 12px; }
.map-canvas { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #fff; }
.map-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 12.5px; margin-top: 12px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fafbfd; }
.map-legend .sep { width: 1px; height: 18px; background: var(--line); }
.map-note { margin-top: 10px; padding: 10px 14px; border-radius: 12px; background: var(--purple-bg); color: #3a2b8f; font-size: 13px; }
.dep-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.dep-table th { text-align: left; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 2px solid var(--line); white-space: nowrap; }
.dep-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--blue); font-weight: 600; text-align: left; }
#pi2map-card:fullscreen { overflow: auto; border-radius: 0; background: #fff; }
#pi2map-card:fullscreen #pi2map-svg { height: calc(100vh - 240px); }
.esc-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 12px; }
.esc-step { border-top: 4px solid var(--line); padding-top: 8px; }
.esc-step.on { border-top-color: var(--purple); }
.chain { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.chain > div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
@media (max-width: 860px) {
  .kpis6, .kpis7 { grid-template-columns: repeat(2, 1fr); }
  .stages5 { grid-template-columns: 1fr; }
  .shell.itview .sidebar { position: static; width: 100%; min-height: 0; display: flex; flex-wrap: wrap; padding: 10px; }
  .shell.itview { flex-direction: column; }
  .side-grp { display: none; }
  .side-link { width: auto; border-left: 0; border-radius: 999px; padding: 6px 12px; }
  .pi2-drawer { width: 100vw; }
}
/* Workforce Identity & SSO */
.sso-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 18px; }

.pp { text-align: center; font-size: 12px; } .pp i { display: block; width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid; margin: 0 auto 4px; background: #fff; }
.pp.pred i { border-style: dashed; } .pp b { display: block; font-size: 12px; } .pp small { color: var(--muted); font-size: 11px; } .pp.cur b { color: var(--navy); }
.rem-steps { margin: 8px 0 0; padding-left: 20px; font-size: 13.5px; } .rem-steps li { color: var(--muted); margin-bottom: 3px; }
.rem-steps li.done { color: var(--green); font-weight: 600; } .rem-steps li.now { color: var(--blue); font-weight: 600; }
details.more-d { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 10px; }
details.more-d summary { cursor: pointer; color: var(--blue); font-size: 13px; font-weight: 600; }
.obs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.rec { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.rec.primary { border-color: #b6d4ec; box-shadow: 0 0 0 3px var(--sky); }
.rec-h { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; } .rec-h b { font-size: 15px; color: var(--navy); }
.rec-dl { display: grid; grid-template-columns: 170px 1fr; gap: 6px 14px; margin: 12px 0 0; font-size: 13.5px; }
.rec-dl dt { color: var(--muted); } .rec-dl dd { margin: 0; } .rec-dl ul { margin: 0; padding-left: 18px; }
.rec-acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; } .rec-acts .btn { padding: 7px 13px; }
.btn:disabled { opacity: .5; cursor: default; }
svg[aria-label="Systems involved"] { max-width: 760px; margin: 0 auto; }
.fc-row { display: grid; grid-template-columns: 130px 1fr auto; gap: 16px; align-items: center; width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; }
.fc-row b { display: block; font-size: 14px; } .fc-row small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.fc-t b { font-size: 18px; color: var(--navy); }
.fc-row .r { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.home-links { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
@media (max-width: 860px) { .fc-row { grid-template-columns: 1fr; } .fc-row .r { flex-direction: row; align-items: center; } .home-links { grid-template-columns: 1fr; } }
@media (max-width: 1200px) { .q-head { display: none; } .q-row { grid-template-columns: 1fr 1fr; } .it-kpis { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 1000px) { .it-grid, .obs-grid, .ctx-grid { grid-template-columns: 1fr; } .sum-grid { grid-template-columns: 1fr 1fr; } .pipe[style] { grid-template-columns: repeat(4, 1fr) !important; } }
@media (max-width: 860px) { .it-kpis { grid-template-columns: repeat(2, 1fr); } .rec-dl { grid-template-columns: 1fr; } .it-notif-dl .wide { grid-column: auto; } .mini-pipe small { display: none; } }
@media (max-width: 1100px) { .m-grid3 { grid-template-columns: 1fr 1fr; } .m-rec { grid-column: 1 / -1; } .m-esc { flex-wrap: wrap; } .m-facts { width: 100%; } }
@media (max-width: 860px) {
  .m-kpis { grid-template-columns: repeat(2, 1fr); } .m-grid3, .m-home { grid-template-columns: 1fr; }
  .m-st b { font-size: 11.5px; } .m-st time, .m-st em { font-size: 10px; } .m-st em { padding: 1px 5px; }
  .m-dl { grid-template-columns: 1fr; } .m-dl dt { margin-top: 6px; }
  .m-inc, .m-inc-h { grid-template-columns: 1fr 1fr; } .m-inc-h { display: none; }
  .m-chev { display: none; }
  .vs-btn small { display: none; }
  .shell.itview .sidebar { height: auto; } .shell.itview .side-foot { display: none; } #sidenav { display: flex; flex-wrap: wrap; gap: 4px; }
  .top.wide .top-in { padding: 10px 16px; } .top.wide .brand img { width: auto; height: 30px; margin-right: 0; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#"><img src="/crystal-clean/logo.webp" alt="Crystal Clean"><span id="product">Service Hub</span></a>
  <div class="spacer"></div>
  <div class="viewsel" id="viewsel">
    <button class="vs-btn" id="vs-btn" aria-haspopup="true" aria-expanded="false"><small>Viewing as</small><b id="vs-label">Employee</b><span aria-hidden="true">▾</span></button>
    <div class="vs-menu" id="vs-menu" role="menu" hidden>
      <button id="v-emp" class="on" role="menuitem"><b>Employee</b><small>Marcus Reed · Service Hub</small></button>
      <button id="v-mgr" role="menuitem"><b>Manager</b><small>John Taylor · Operations Manager</small></button>
      <button id="v-it" role="menuitem"><b>IT Admin</b><small>Mark Wood · IT Admin Portal</small></button>
      <button id="v-sso" role="menuitem"><b>Identity &amp; SSO</b><small>Keycloak sign-in demo</small></button>
    </div>
  </div>
  <div class="bellwrap" id="bell"></div>
  <div class="who" id="who"></div>
  <button class="icon-btn" id="reset" title="Reset demo" aria-label="Reset demo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
</div></header>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar"><nav id="sidenav"></nav><div class="side-foot"><span>Powered by</span><img src="/tachyon-logo.png" alt="Tachyon"></div></aside>
  <main id="main"></main>
</div>
<footer>Crystal Clean IT · Service Hub</footer>
<div class="toast" id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const S = { view: store.get("cc.view", "emp"), hub: null, ops: null, thread: [], sel: null, stageSel: null, notes: {}, known: null, busy: false };

async function api(method, url, body, role) {
  const headers = { "Content-Type": "application/json", "X-CC-User": "marcus", "X-CC-Role": role || (S.view === "it" ? "it" : "employee") };
  const r = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Request failed (${r.status})`);
  return j;
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 4000); }
const ago = (iso) => { if (!iso) return ""; const s = (Date.now() - Date.parse(iso)) / 1000; return s < 60 ? "just now" : s < 3600 ? `${Math.floor(s / 60)} min ago` : s < 86400 ? `${Math.floor(s / 3600)} h ago` : new Date(iso).toLocaleDateString(); };
const clock = (iso) => (iso ? new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "");

/* ============================================================ employee */
const CHIPS = ["My handheld says my account is locked", "RouteOps won't load my route", "Scanned manifests won't save to the branch share", "How do I connect to the VPN?"];

function renderEmp() {
  const h = S.hub; if (!h) return;
  const e = h.employee, th = S.thread;
  const hadFocus = document.activeElement && document.activeElement.id === "q";
  const openDetails = new Set([...document.querySelectorAll("details.more[open]")].map((d) => d.dataset.id));
  $("#main").innerHTML = `
  <section class="card hero">
    <h1>Hi ${esc(e.first)}, how can we help?</h1>
    <p class="sub">Tell us what's not working. Most problems are fixed in a few minutes.</p>
    <form class="ask" id="ask"><input id="q" autocomplete="off" placeholder="Describe the problem, for example: RouteOps won't load my route" aria-label="Describe your problem"><button id="send" ${S.busy ? "disabled" : ""}>Send</button></form>
    <div class="chips">${CHIPS.map((c) => `<button class="chip" data-chip="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    ${th.length ? `<div class="thread">${th.slice(-6).map((m) => `<div class="msg ${m.me ? "me" : "bot"} ${m.typing ? "typing" : ""}">${esc(m.text)}</div>`).join("")}</div>` : ""}
  </section>
  <div class="grid2">
    <section class="card pad"><h2>Heads up</h2>${h.alerts.length ? h.alerts.map(alertCard).join("") : `<p class="empty">Nothing needs your attention. We'll let you know here before something affects your work.</p>`}</section>
    <section class="card pad"><h2>My requests</h2>${h.requests.length ? h.requests.map((r, i) => reqCard(r, i === 0 || r.outcome === null, openDetails)).join("") : `<p class="empty">No requests yet.</p>`}</section>
  </div>`;
  const q = $("#q"); q.value = S.draft || ""; q.oninput = () => (S.draft = q.value);
  if (S.focus || hadFocus) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); S.focus = false; }
}
function alertCard(a) {
  return `<div class="alert ${a.level}"><b>${esc(a.title)}</b><p>${esc(a.text)}</p><div class="row">
    ${a.action ? `<button class="btn primary" data-act="${esc(a.id)}">${esc(a.action)}</button>` : ""}
    <button class="btn" data-dismiss="${esc(a.id)}">Dismiss</button></div></div>`;
}
function reqCard(r, expanded, openDetails) {
  const done = r.outcome === "resolved", hand = r.outcome === "handover";
  const steps = r.stages.map((s, i) => {
    let c = "";
    if (done || i < r.stage) c = "on"; else if (i === r.stage) c = hand ? "warn" : "now";
    const label = hand && i === 3 ? "With a technician" : s;
    if (hand && i === 3) c = "warn";
    return `<div class="${c}"><i></i>${esc(label)}</div>`;
  }).join("");
  const journey = `<ul class="journey">${r.journey.map((j) => `<li><time>${clock(j.at)}</time><span>${esc(j.text)}</span></li>`).join("")}</ul>`;
  return `<div class="req"><div class="req-h"><b>${esc(r.use_case === "IT issue" ? r.summary : r.use_case)}</b><small>${r.number ? esc(r.number) + " · " : ""}${ago(r.created)}</small></div>
    <div class="steps">${steps}</div>
    ${expanded ? journey : `<p style="margin:0;font-size:14px">${esc(r.message)}</p><details class="more" data-id="${esc(r.id)}" ${openDetails.has(r.id) ? "open" : ""}><summary>See every step</summary>${journey}</details>`}</div>`;
}
async function send(text) {
  text = (text || "").trim(); if (!text || S.busy) return;
  S.thread.push({ me: true, text }, { typing: true, text: "…" }); S.busy = true; S.draft = ""; renderEmp();
  try { const r = await api("POST", "/api/cc/chat", { text }); S.thread.pop(); S.thread.push({ text: r.reply }); }
  catch (e) { S.thread.pop(); S.thread.push({ text: "Sorry, I couldn't reach the Service Hub. Please try again." }); }
  S.busy = false; S.focus = true; await loadEmp();
}

/* ============================================================ charts */
function lineChart(series, opt) {
  const W = 560, H = opt.h || 120, P = { l: 34, r: 8, t: 8, b: 18 };
  const n = Math.max(...series.map((s) => s.pts.length), 2);
  const max = opt.max || Math.max(1, ...series.flatMap((s) => s.pts.map((p) => p ?? 0)));
  const x = (i) => P.l + (i / (n - 1)) * (W - P.l - P.r), y = (v) => P.t + (1 - Math.min(v, max) / max) * (H - P.t - P.b);
  const grid = [0, 0.5, 1].map((f) => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="#e3e8ee"/><text x="${P.l - 5}" y="${y(max * f) + 4}" text-anchor="end" font-size="10" fill="#5d6b78">${Math.round(max * f)}${opt.unit || ""}</text>`).join("");
  const lines = series.map((s) => {
    const d = s.pts.map((v, i) => (v == null ? null : `${x(i)},${y(v)}`)).filter(Boolean).join(" ");
    const marks = (s.marks || []).map((m, i) => (m ? `<circle cx="${x(i)}" cy="${y(s.pts[i] ?? max)}" r="3.5" fill="#c0352b"/>` : "")).join("");
    return `<polyline points="${d}" fill="none" stroke="${s.color}" stroke-width="2"/>${marks}`;
  }).join("");
  const ref = opt.ref != null ? `<line x1="${P.l}" x2="${W - P.r}" y1="${y(opt.ref)}" y2="${y(opt.ref)}" stroke="#c0352b" stroke-dasharray="3 3"/><text x="${W - P.r}" y="${y(opt.ref) + 12}" text-anchor="end" font-size="10" fill="#c0352b">${esc(opt.refLabel || "")}</text>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || "chart")}">${grid}${ref}${lines}<text x="${P.l}" y="${H - 3}" font-size="10" fill="#5d6b78">${esc(opt.from || "")}</text><text x="${W - P.r}" y="${H - 3}" text-anchor="end" font-size="10" fill="#5d6b78">${esc(opt.to || "now")}</text></svg>`;
}
const PART_COLORS = { "Manifest scans": "#0a5c9e", "Manifest scans > 90 days": "#7fb3e0", "Scanner temp files": "#c0352b", "Service logs": "#b26a00" };
const stackBar = (parts, cap) => `<div class="stack">${Object.entries(parts).map(([k, v]) => `<span title="${esc(k)}: ${v} MB" style="width:${(100 * v) / cap}%;background:${PART_COLORS[k] || "#999"}"></span>`).join("")}</div>`;

/* ====================================================== impact map */
function impactMap(r) {
  const verify = r.pipeline.find((s) => s.key === "verify"), fix = r.pipeline.find((s) => s.key === "remediate");
  const fixed = verify && verify.status === "done" && verify.output && verify.output.passed;
  const fixing = fix && fix.status === "running";
  const bad = fixed ? "ok" : fixing ? "fixing" : "bad";
  const v = r.visual || {}, sm = v.summary || {};
  const kind = v.kind || ({ account_locked: "signins", app_down: "service", storage_full: "disk" })[r.intent];
  const nodes = {
    signins: [["Marcus's handheld", fixed ? "signs in with new password" : "using the OLD password", fixed ? "ok" : "warn"],
      [`${v.system || "Identity"} account`, fixed ? "Active" : fixing ? "Unlocking…" : "Locked", bad], ["RouteOps Mobile app", fixed ? "available" : "blocked", fixed ? "ok" : "grey"]],
    service: [["Driver handhelds", fixed ? "routes loading" : "can't load routes", fixed ? "ok" : "warn"],
      ["RouteOps Dispatch API", fixed ? "HTTP 200" : fixing ? "Restarting…" : `HTTP ${sm.http_code || 503}`, bad],
      ["Dispatch DB pool", fixed ? "healthy" : `${sm.pool_in_use ?? "?"}/${sm.pool_max ?? 50} in use`, bad]],
    disk: [["Branch scanner", fixed ? "scans saving" : "scans failing", fixed ? "ok" : "warn"],
      [`${v.server || "Branch server"} ${v.volume || ""}`, fixed ? "space freed" : fixing ? "Cleaning…" : `${v.used_pct ?? "?"}% full`, bad], ["Archive tier", fixed ? "old scans archived" : "standing by", fixed ? "ok" : "grey"]],
  }[kind];
  if (!nodes) return "";
  const C = { ok: ["#e9f6ec", "#2e9a46"], bad: ["#fdecea", "#c0352b"], warn: ["#fff4e0", "#b26a00"], grey: ["#f5f7fa", "#8a96a3"], fixing: ["#e8f3fb", "#0a5c9e"] };
  const W = 640, w = 186, h = 64, gap = (W - 3 * w) / 2;
  const box = (nd, i) => { const [fill, stroke] = C[nd[2]]; const x = i * (w + gap); return `<rect x="${x + 1}" y="1" width="${w - 2}" height="${h}" rx="10" fill="${fill}" stroke="${stroke}" stroke-width="2"/>
    <text x="${x + w / 2}" y="27" text-anchor="middle" font-size="13" font-weight="700" fill="#17212b">${esc(nd[0])}</text><text x="${x + w / 2}" y="47" text-anchor="middle" font-size="12" fill="${stroke}">${esc(nd[1])}</text>`; };
  const arrow = (i) => { const x1 = i * (w + gap) + w, x2 = x1 + gap; return `<line x1="${x1 + 4}" y1="${h / 2 + 1}" x2="${x2 - 8}" y2="${h / 2 + 1}" stroke="#8a96a3" stroke-width="2"/><path d="M${x2 - 9},${h / 2 - 4} L${x2 - 2},${h / 2 + 1} L${x2 - 9},${h / 2 + 6}" fill="#8a96a3"/>`; };
  return `<div class="panel"><div class="panel-h"><h3>Impact map</h3><span class="pill ${fixed ? "ok" : fixing ? "run" : "bad"}">${fixed ? "Fixed and verified" : fixing ? "Fixing now" : "Problem"}</span></div>
    <svg class="chart" viewBox="0 0 ${W} ${h + 4}" role="img" aria-label="Systems involved">${nodes.map(box).join("")}${arrow(0)}${arrow(1)}</svg></div>`;
}

/* ========================================================== evidence */
function evidence(r) {
  const v = r.visual; if (!v) return "";
  const after = r.visual_after;
  if (v.kind === "signins") {
    const fails = v.attempts.filter((a) => a.result === "Failed");
    const afterPw = fails.filter((a) => v.password_changed_at && a.at >= v.password_changed_at);
    const ips = [...new Set(fails.map((a) => a.ip).filter(Boolean))];
    const rows = []; let marked = false;
    for (const a of v.attempts) {
      if (!marked && v.password_changed_at && a.at >= v.password_changed_at) { rows.push(`<tr class="marker"><td>${clock(v.password_changed_at)}</td><td colspan="4">🔑 Password changed (${esc(v.system)} admin event)</td></tr>`); marked = true; }
      rows.push(`<tr><td>${clock(a.at)}</td><td>${esc(a.app)}</td><td>${esc(a.ip || "–")}</td><td><span class="pill ${a.result === "Failed" ? "bad" : "ok"}">${esc(a.result)}</span></td><td>${esc(a.reason)}</td></tr>`);
    }
    if (!marked && v.password_changed_at) rows.push(`<tr class="marker"><td>${clock(v.password_changed_at)}</td><td colspan="4">🔑 Password changed</td></tr>`);
    return `<div class="panel"><div class="panel-h"><h3>Evidence · sign-in attempts for ${esc(v.account)}</h3><small>Real ${esc(v.system)} events, last 2 hours</small></div>
      <div class="facts"><div class="fact ${v.status === "LOCKED_OUT" ? "bad" : "good"}">Account<b>${v.status === "LOCKED_OUT" ? "Locked" : "Active"}</b></div>
        <div class="fact">Password changed<b>${v.password_changed_at ? clock(v.password_changed_at) : "–"}</b></div>
        <div class="fact bad">Failures after the change<b>${afterPw.length}</b></div><div class="fact">Devices / IPs<b>${ips.length}</b></div>
        ${after ? `<div class="fact good">After the fix<b>${after.status === "LOCKED_OUT" ? "Locked" : "Active"}</b></div>` : ""}</div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Time</th><th>App</th><th>IP address</th><th>Result</th><th>Reason</th></tr></thead><tbody>${rows.join("") || `<tr><td colspan="5">No sign-in events in the last 2 hours.</td></tr>`}</tbody></table></div></div>`;
  }
  if (v.kind === "service") {
    const s = v.samples || [], sm = v.summary || {};
    const lat = s.map((x) => (x.ok ? x.ms : null)), err = s.map((x) => !x.ok);
    const log = (v.log || []).map((l) => `<span class="${/ ERROR /.test(l) ? "e" : /WARN/.test(l) ? "w" : "i"}">${esc(l)}</span>`).join("\n");
    const as = after && after.summary;
    return `<div class="panel"><div class="panel-h"><h3>Evidence · RouteOps Dispatch API</h3><small>Real health checks every 3 s and the service log</small></div>
      <div class="facts"><div class="fact ${sm.status === "up" ? "" : "bad"}">Status at diagnosis<b>${esc(sm.status)} · HTTP ${sm.http_code}</b></div>
        <div class="fact ${sm.pool_in_use >= 40 ? "bad" : ""}">DB pool in use<b>${sm.pool_in_use ?? "?"}/${sm.pool_max}</b></div>
        <div class="fact">Availability (1 min)<b>${sm.availability_last_min}%</b></div><div class="fact">Failed checks in a row<b>${sm.consecutive_failures}</b></div>
        ${as ? `<div class="fact good">After restart<b>HTTP ${as.http_code} · pool ${as.pool_in_use}/${as.pool_max}</b></div>` : ""}</div>
      <h3 style="margin-top:6px">DB connection pool in use · red dot = failed health check</h3>${lineChart([{ pts: s.map((x) => x.pool ?? 50), marks: err, color: "#b26a00" }], { max: 50, ref: 50, refLabel: "pool exhausted", from: s[0] ? clock(s[0].at) : "", to: "diagnosis", label: "pool usage" })}
      <h3 style="margin-top:10px">Response time (ms)</h3>${lineChart([{ pts: lat, color: "#0a5c9e" }], { from: s[0] ? clock(s[0].at) : "", to: "diagnosis", label: "latency" })}
      <h3 style="margin-top:10px">Service log at diagnosis</h3><div class="logbox">${log || "No log lines."}</div></div>`;
  }
  if (v.kind === "disk") {
    const cap = v.capacity_mb, aft = after && after.parts;
    const total = (p) => Object.values(p).reduce((a, b) => a + b, 0);
    const trend = (v.samples || []).map((x) => x.pct);
    return `<div class="panel"><div class="panel-h"><h3>Evidence · ${esc(v.server)} ${esc(v.volume)}</h3><small>Measured on the volume</small></div>
      <div class="facts"><div class="fact bad">Used before<b>${v.used_pct}%</b></div>${after ? `<div class="fact good">Used after<b>${after.used_pct}%</b></div>` : ""}<div class="fact">Capacity<b>${cap} MB</b></div></div>
      <div class="cmp"><span>Before</span>${stackBar(v.parts, cap)}<span>${total(v.parts).toFixed(0)} MB</span></div>
      ${aft ? `<div class="cmp"><span>After</span>${stackBar(aft, cap)}<span>${total(aft).toFixed(0)} MB</span></div>` : ""}
      <div class="legend">${Object.keys(v.parts).map((k) => `<span><i style="background:${PART_COLORS[k]}"></i>${esc(k)} ${v.parts[k]} MB${aft ? ` → ${aft[k]} MB` : ""}</span>`).join("")}</div>
      ${trend.length > 2 ? `<h3 style="margin-top:12px">Usage trend (last 3 days)</h3>${lineChart([{ pts: trend, color: "#c0352b" }], { max: 100, ref: 100, refLabel: "full", unit: "%", from: "3 days ago", to: "diagnosis", label: "disk trend" })}` : ""}</div>`;
  }
  return "";
}

/* --------------------------------------------------------- Observability */
function oxVisible() {
  const X = itx(), now = X ? X.now : 535;
  const nPre = Math.max(9, Math.min(12, Math.floor((now - OX_T0) / 5) + 1));
  const pts = OX_SERIES.avail.pre.slice(0, nPre).map((_, i) => ({ i, t: OX_T0 + 5 * i, post: false }));
  if (X && X.remDone) OX_SERIES.avail.post.forEach((_, j) => { const t = X.fixAt + 5 * j; if (j === 0 || t <= Math.max(now, X.fixAt + 15)) pts.push({ i: nPre + j, j, t, post: true }); });
  return pts;
}
const oxVal = (key, p) => (p.post ? OX_SERIES[key].post[p.j] : OX_SERIES[key].pre[p.i]);
function oxChart(key) {
  const s = OX_SERIES[key], pts = oxVisible(), X = itx(), W = 520, H = 170, P = { l: 46, r: 12, t: 12, b: 26 };
  const vals = pts.map((p) => oxVal(key, p)), lo = s.min ?? 0, hi = s.max ?? Math.max(...vals) * 1.12;
  const x = (k) => P.l + (k * (W - P.l - P.r)) / Math.max(1, pts.length - 1), y = (v) => P.t + (1 - (Math.max(lo, Math.min(v, hi)) - lo) / (hi - lo)) * (H - P.t - P.b);
  const grid = [0, 0.5, 1].map((f) => { const v = lo + (hi - lo) * f; return `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e8ee"/><text x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="#5d6b78">${hi - lo >= 20 ? Math.round(v) : Math.round(v * 10) / 10}</text>`; }).join("");
  const fixK = pts.findIndex((p) => p.post);
  const fix = fixK > 0 ? `<line x1="${x(fixK)}" x2="${x(fixK)}" y1="${P.t}" y2="${H - P.b}" stroke="#2e9a46" stroke-dasharray="4 3"/><text x="${x(fixK) + 4}" y="${P.t + 10}" font-size="10" fill="#2e9a46">fix applied</text>` : "";
  const dots = pts.map((p, k) => { const v = vals[k], b = s.bad(v); return `<circle cx="${x(k)}" cy="${y(v)}" r="${b ? 5 : 4}" fill="${b ? "#c0352b" : p.post ? "#2e9a46" : s.color}" stroke="#fff" stroke-width="1.5" data-a="obs:${key}:${k}" style="cursor:pointer"><title>${hm(p.t)} · ${v}${s.unit}</title></circle>`; }).join("");
  const xl = [0, 8, pts.length - 1].filter((k, i, a) => k < pts.length && a.indexOf(k) === i).map((k) => `<text x="${x(k)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#5d6b78">${hm(pts[k].t)}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.name)} over time">${grid}${fix}<polyline points="${pts.map((p, k) => `${x(k)},${y(vals[k])}`).join(" ")}" fill="none" stroke="${s.color}" stroke-width="2"/>${dots}${xl}</svg>`;
}

// The persona cards only start a real Keycloak sign-in; identity, account status and every result come
// from the backend, which talks to Keycloak. No passwords or tokens ever reach this page.
const SSO = { status: null, session: null, attempt: null, result: null, workspace: null, check: null, popup: null, menu: false, error: null };
const SSO_STEPS = ["Persona selection", "Keycloak login", "Authentication", "Token validation", "Access decision", "Dashboard"];
let ssoTimer = null;

async function loadSso() {
  try {
    const [st, se] = await Promise.all([api("GET", "/api/cc/identity/status"), api("GET", "/api/cc/identity/session")]);
    SSO.status = st; SSO.session = se; SSO.error = null;
    if (se.authenticated && !SSO.workspace && !SSO.check) ssoProtected();
  } catch (e) { SSO.error = e.message; }
  if (S.view !== "sso") return;
  renderWho(); renderSso();
}
function ssoStage() {
  const a = SSO.attempt, se = SSO.session || {};
  if (se.authenticated) return { done: SSO_STEPS.length };
  if (a && a.status === "pending") return { done: 1, cur: 1 };
  if (a && a.status === "denied") return { done: a.result && a.result.authentication === "Successful" ? 4 : 2, fail: a.result && a.result.authentication === "Successful" ? 4 : 2 };
  if (a && (a.status === "expired" || a.status === "abandoned")) return { done: 1, fail: 1 };
  return { done: 0, cur: 0 };
}
function ssoFlow() {
  const s = ssoStage();
  return `<div class="flow">${SSO_STEPS.map((t, i) => { const cls = s.fail === i ? "fail" : i < s.done ? "done" : s.cur === i ? "cur" : "";
    return `${i ? '<span class="flow-arrow">→</span>' : ""}<span class="flow-step ${cls}"><i>${cls === "done" ? "✓" : cls === "fail" ? "✕" : i + 1}</i>${esc(t)}</span>`; }).join("")}</div>`;
}
function ssoPersona(p) {

function ssoStatusPanel(st) {

function ssoTimeline(st) {

async function ssoLogin(key) {
  if (SSO.attempt && SSO.attempt.status === "pending") return;
  const pop = window.open("about:blank", "cc-keycloak", "width=520,height=720");
  try { if (pop) pop.document.write('<p style="font:15px Segoe UI,system-ui,sans-serif;padding:24px">Connecting to Keycloak…</p>'); } catch (e) {}
  SSO.result = null; SSO.check = null; SSO.workspace = null;
  try {
    const r = await api("POST", "/api/cc/identity/login", { persona: key });
    const p = ((SSO.status && SSO.status.personas) || []).find((x) => x.key === key) || {};
    SSO.attempt = { id: r.attempt, persona: key, username: p.username, status: "pending", url: r.authorization_url, last_error: null };
    if (pop && !pop.closed) pop.location.href = r.authorization_url; else SSO.attempt.blocked = true;

  } catch (e) { if (pop) pop.close(); toast(e.message); }

}
function ssoPoll(delay) {
  clearTimeout(ssoTimer);

  ssoTimer = setTimeout(async () => {
    try { Object.assign(SSO.attempt, await api("GET", `/api/cc/identity/attempt/${encodeURIComponent(SSO.attempt.id)}`)); } catch (e) {}
    if (SSO.attempt.status !== "pending") return ssoDone();
    if (SSO.popup && SSO.popup.closed && !SSO.attempt.closedAt) SSO.attempt.closedAt = Date.now();
    if (SSO.attempt.closedAt && Date.now() - SSO.attempt.closedAt > 4000) { SSO.attempt.status = "abandoned"; return ssoDone(); }
    if (S.view === "sso") renderSso();
    ssoPoll(1200);
  }, delay);
}
async function ssoDone() {
  const a = SSO.attempt, pop = SSO.popup;
  SSO.result = a.result || (a.status === "abandoned" ? { abandoned: true } : null);
  // A refused account stays on Keycloak's own page ("Account is disabled"): leave it visible briefly, then close it.
  if (pop && !pop.closed) setTimeout(() => { try { pop.close(); } catch (e) {} }, a.status === "denied" ? 2500 : 0);

}
function ssoCancel() {
  if (SSO.popup && !SSO.popup.closed) SSO.popup.close();

}
async function ssoSwitch() {
  SSO.menu = false;

async function ssoProtected() {

    if (n && n.go.startsWith("inc:")) { MG.page = "incidents"; MGU.drawer = n.go; }
    else if (n) { MG.page = "predictive"; MGU.drawer = n.go === "esc" ? "overview" : n.go; }
    MGU.modal = null;
  }
  else if (a === "sim") {
    if (arg === "back") { MG.stage = Math.max(0, MG.stage - 1); MG.playing = false; }
    else if (arg === "next") { MG.stage = Math.min(4, MG.stage + 1); MG.playing = false; }
    else if (arg === "play") MG.playing = !MG.playing && MG.stage < 4;
    else if (arg === "restart") { MG.stage = 1; MG.playing = false; }
  }
  else if (a === "download") {
    const url = URL.createObjectURL(new Blob([mgrReportText()], { type: "text/plain" })), el = document.createElement("a");
    el.href = url; el.download = "outlook-escalation-summary-simulated.txt"; el.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("Summary downloaded."); return;
  }
  else if (a === "reset") return mgrReset();
  mgrSave(); renderMgr();
}
function mgrReset() {
  if (!confirm("Reset the manager demo? This clears John's simulated incidents and notifications and restarts the escalation at Degrading.")) return;
  MG = mgrFresh(); MGU.drawer = MGU.modal = MGU.menu = null; mgrSave(); renderMgr(); toast("Manager demo reset.");
}
document.addEventListener("click", (ev) => {
  if (S.view !== "mgr") return;
  const t = ev.target.closest("[data-m]");
  if (t && !t.disabled) return mgrAct(t.dataset.m);
  if (MGU.menu && !ev.target.closest("#who, #bell")) { MGU.menu = null; mgrHeader(); }
});
document.addEventListener("keydown", (ev) => {
  if (S.view !== "mgr" || ev.key !== "Escape" || !(MGU.menu || MGU.drawer || MGU.modal)) return;
  if (MGU.menu) { MGU.menu = null; return mgrHeader(); }
  MGU.drawer = MGU.modal = null; renderMgr();
});
setInterval(() => {
  if (!MG.playing) return;
  if (MG.stage < 4) MG.stage++;
  if (MG.stage >= 4) MG.playing = false;
  mgrSave(); renderMgr();
}, 3500);

/* =============================================================== shell */
function renderWho() {
  const e = S.hub ? S.hub.employee : { name: "Marcus Reed", initials: "MR", title: "Field Service Representative", site: "Indianapolis, IN branch" };
  $("#who").innerHTML = S.view === "it"
    ? `<span class="av it">MW</span><span><b>Mark Wood</b><small>IT Administrator · IT Admin Portal</small></span>`
    : `<span class="av">${esc(e.initials)}</span><span><b>${esc(e.name)}</b><small>${esc(e.title)} · ${esc(e.site)}</small></span>`;
  if (S.view === "sso") $("#who").innerHTML = ssoWho();
  $("#bell").innerHTML = "";
  if (S.view === "mgr") mgrHeader();
  $("#product").textContent = S.view === "it" ? "IT Admin Portal" : S.view === "sso" ? "Workforce Identity" : "Service Hub";
  $("#vs-label").textContent = { emp: "Employee", mgr: "Manager", it: "IT Admin", sso: "Identity & SSO" }[S.view] || "Employee";
  $("#v-emp").classList.toggle("on", S.view === "emp"); $("#v-it").classList.toggle("on", S.view === "it"); $("#v-sso").classList.toggle("on", S.view === "sso"); $("#v-mgr").classList.toggle("on", S.view === "mgr");
  $("#shell").classList.toggle("itview", S.view === "it" || S.view === "mgr");
  $(".top").classList.toggle("wide", S.view === "it" || S.view === "mgr");
  if (S.view === "it") renderSidebar();
  else if (S.view !== "mgr") $("#sidenav").innerHTML = "";
}
function paintIt() {
  const nd = document.querySelector("details.notes"); if (nd) S.notesOpen = nd.open;
  const y = window.scrollY; renderIt(); window.scrollTo(0, y);
}
async function loadEmp() {
  try { S.hub = await api("GET", "/api/cc/hub"); } catch (e) { $("#main").innerHTML = `<div class="card pad"><p class="empty">The Service Hub is starting up. ${esc(e.message)}</p></div>`; return; }
  if (S.view === "emp") { renderWho(); renderEmp(); }
}
let lastNotesKey = "";
async function loadIt() {
  if (loadIt.busy) return; // the ServiceNow-backed call can take several seconds; don't stack requests
  loadIt.busy = true;
  let o; try { o = await api("GET", "/api/cc/ops", null, "it"); S.opsErr = null; } catch (e) { S.opsErr = `Backend not reachable: ${e.message}`; if (S.view === "it") { renderWho(); paintIt(); } return; } finally { loadIt.busy = false; }
  const ids = o.tickets.map((x) => x.sys_id);
  if (S.known) { const fresh = ids.find((id) => !S.known.has(id)); if (fresh) { S.sel = fresh; S.stageSel = null; } }
  S.known = new Set(ids); S.ops = o;
  if (S.view !== "it") return;
  renderWho(); paintIt();
  const cur = o.tickets.find((x) => x.sys_id === S.sel);
  if (cur) { const key = cur.sys_id + ":" + (cur.run ? cur.run.pipeline.filter((s) => s.status !== "pending").length : 0) + ":" + cur.state; if (key !== lastNotesKey) { lastNotesKey = key; loadNotes(cur.sys_id); } }
}
const load = () => (S.view === "it" ? loadIt() : S.view === "sso" ? loadSso() : S.view === "mgr" ? renderMgr() : loadEmp());
function vsOpen(open) { $("#vs-menu").hidden = !open; $("#vs-btn").setAttribute("aria-expanded", String(open)); }
$("#vs-btn").onclick = (ev) => { ev.stopPropagation(); vsOpen($("#vs-menu").hidden); };
document.addEventListener("click", (ev) => { if (!ev.target.closest("#viewsel")) vsOpen(false); });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") vsOpen(false); });
function setView(v) { vsOpen(false); S.view = v; store.set("cc.view", v); MGU.menu = null; renderWho(); $("#main").innerHTML = ""; window.scrollTo(0, 0); if (v === "it") renderIt(); load(); }

$("#v-emp").onclick = () => setView("emp");
$("#v-mgr").onclick = () => setView("mgr");
$("#v-it").onclick = () => setView("it");
$("#v-sso").onclick = () => setView("sso");
$("#reset").onclick = async () => {
  if (S.view === "mgr") return mgrReset();
  if (!confirm("Reset the demo? Marcus will be locked out again, the scan server filled, and the RouteOps export job started. Earlier ServiceNow incidents stay in ServiceNow but are hidden here.")) return;
  const b = $("#reset"); b.classList.add("spin"); toast("Resetting… about 15 seconds.");
  try { const r = await api("POST", "/api/cc/demo/reset", null, "it"); S.thread = []; S.sel = null; S.stageSel = null; S.known = null; S.notes = {}; S.draft = ""; toast(r.message); }
  catch (e) { toast(e.message); }
  b.classList.remove("spin"); load();
};
document.addEventListener("submit", (ev) => { if (ev.target.id === "ask") { ev.preventDefault(); send($("#q").value); } });
document.addEventListener("click", async (ev) => {
  if (SSO.menu && !ev.target.closest("#who")) { SSO.menu = false; renderWho(); }
  if (ev.target.closest("a") || ev.target.closest("summary")) return;
  const pmn = ev.target.closest("[data-pi2map-node]");
  if (pmn) {
    if (PI2MAP_JUST_DRAGGED) { PI2MAP_JUST_DRAGGED = false; return; }
    pi2MapState().selected = pmn.dataset.pi2mapNode;
    PI2.drawer = { kind: "node", key: pmn.dataset.pi2mapNode }; pi2Save(); return renderIt();
  }
  const po = ev.target.closest("[data-pi2-open]");
  if (po) { const [kind, key] = po.dataset.pi2Open.split(":"); PI2.drawer = { kind, key }; pi2Save(); return renderIt(); }
  if (ev.target.closest("[data-pi2-close]")) { PI2.drawer = null; pi2Save(); return renderIt(); }
  const b = ev.target.closest("button, [data-sel]"); if (!b || b.dataset.m || b.dataset.a || b.id === "reset" || b.id === "v-emp" || b.id === "v-it" || b.id === "v-sso" || b.id === "v-mgr") return;
  if (b.dataset.chip) return send(b.dataset.chip);
  if (b.dataset.ssoLogin) return ssoLogin(b.dataset.ssoLogin);
  if (b.dataset.ssoCancel) return ssoCancel();
  if (b.dataset.ssoMenu) { SSO.menu = !SSO.menu; return renderWho(); }
  if (b.dataset.ssoSwitch) return ssoSwitch();
  if (b.dataset.ssoProtected) return ssoProtected();
  if (b.dataset.itPage) { S.itPage = b.dataset.itPage; store.set("cc.itpage", S.itPage); PI2.drawer = null; PI2MAP_DRAG = null; pi2Save(); window.scrollTo({ top: 0 }); return renderIt(); }
  if (b.dataset.piTab) { S.piTab = b.dataset.piTab; store.set("cc.pitab", S.piTab); S.itPage = "predictive"; store.set("cc.itpage", "predictive"); S.piView = "model"; store.set("cc.piview", "model"); PI2.drawer = null; PI2MAP_DRAG = null; pi2Save(); window.scrollTo({ top: 0 }); return renderIt(); }
  if (b.dataset.pi2Notif) {
    const v = b.dataset.pi2Notif, i = v.indexOf(":"), act = v.slice(0, i), arg = v.slice(i + 1);
    PI2.notif = PI2.notif || {};
    if (act === "ack") PI2.notif[arg] = { ...(PI2.notif[arg] || {}), ack: true };
    else if (act === "inv") { PI2.notif[arg] = { ...(PI2.notif[arg] || {}), ack: true, inv: true }; S.piTab = "causal"; toast("Investigation started for this alert."); }
    else if (act === "map") { const M = pi2MapState(); M.selected = arg; M.mode = "overview"; M.trace = false; S.piTab = "map"; PI2.drawer = { kind: "node", key: arg }; }
    store.set("cc.pitab", S.piTab); pi2Save(); return renderIt();
  }
  if (b.dataset.pi2) return pi2Control(b.dataset.pi2);
  if (b.dataset.pi2wi) return pi2WhatIfControl(b.dataset.pi2wi);
  if (b.dataset.pi2map) {
    const v = b.dataset.pi2map, M = pi2MapState();
    if (v === "fullscreen") { const c = document.getElementById("pi2map-card"); if (document.fullscreenElement) document.exitFullscreen(); else if (c && c.requestFullscreen) c.requestFullscreen(); return; }
    if (v === "download") return pi2MapDownload();
    if (v === "zoomin") pi2MapZoomBy(1.25);
    else if (v === "zoomout") pi2MapZoomBy(0.8);
    else if (v === "reset") pi2MapReset();
    else if (v === "trace") M.trace = !M.trace;
    else if (v === "clear") { M.selected = null; PI2.drawer = null; }
    else if (v.startsWith("mode-")) { M.mode = v.slice(5); M.trace = false; }
    else if (v.startsWith("view-")) { M.view = v.slice(5); pi2MapReset(); }
    return renderIt();
  }
  if (b.dataset.pi2mapFilter) { pi2MapToggleFilter(b.dataset.pi2mapFilter); return renderIt(); }
  if (b.dataset.stage) { S.stageSel = b.dataset.stage; return paintIt(); }
  try {
    if (b.dataset.act) { b.disabled = true; await api("POST", `/api/cc/alerts/${encodeURIComponent(b.dataset.act)}/act`); toast("On it. Follow every step under My requests."); return loadEmp(); }
    if (b.dataset.dismiss) { await api("POST", `/api/cc/alerts/${encodeURIComponent(b.dataset.dismiss)}/dismiss`); return loadEmp(); }
    if (b.dataset.sel || b.dataset.review) { S.sel = b.dataset.sel || b.dataset.review; S.stageSel = b.dataset.review ? "approval" : null; S.wbSel = "tk"; store.set("cc.wbsel", "tk"); itGo("workbench"); lastNotesKey = ""; paintIt(); return loadIt(); }
    if (b.dataset.approve || b.dataset.reject) {
      b.disabled = true; const id = b.dataset.approve || b.dataset.reject;
      await api("POST", `/api/cc/ops/approve/${encodeURIComponent(id)}`, { decision: b.dataset.approve ? "approve" : "reject" }, "it");
      S.stageSel = null; toast(b.dataset.approve ? "Approved. The Remediation Agent is restarting the service." : "Rejected. The ticket goes to the Service Desk."); return loadIt();
    }
    if (b.dataset.demo) { b.disabled = true; toast("Working…"); const r = await api("POST", `/api/cc/demo/${b.dataset.demo}`, null, "it"); toast(r.message); return loadIt(); }
  } catch (e) { toast(e.message); b.disabled = false; }
});
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && S.view === "it") renderIt(); });
setView(S.view);
setInterval(() => { if (!document.hidden && S.view !== "mgr") load(); }, 2500);
setInterval(() => {
  let changed = false;
  if (PI2.running && PI2.step < 4) { PI2.step++; PI2.peak = Math.max(PI2.peak || 0, PI2.step); changed = true; if (PI2.step >= 4) PI2.running = false; }
  else if (PI2.recovering) { if (PI2.step > 0) { PI2.step--; changed = true; } else { PI2.recovering = false; PI2.applied[PI2.scenario] = true; PI2.autoRemediations = (PI2.autoRemediations || 0) + 1; changed = true; } }
  if (changed) { pi2Save(); if (S.view === "it") paintIt(); }
}, 1500);
</script>
