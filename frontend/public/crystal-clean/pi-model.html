<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integration services model</title>
<!-- Predictive Intelligence: the illustrative "shared integration service degradation" model, kept from the earlier
     Crystal Clean Service Hub page and shown inside the IT Admin Portal (Predictive Intelligence > Integration services model).
     Entirely client-side and deterministic: illustrative data, no backend calls. -->
<style>
:root {
  --navy: #0b2c4d; --blue: #0a5c9e; --sky: #e8f3fb; --green: #2e9a46; --green-bg: #e9f6ec;
  --amber: #b26a00; --amber-bg: #fff4e0; --red: #c0352b; --red-bg: #fdecea; --violet: #5b3fb5; --violet-bg: #efeafd; --purple: #6e4ff6; --purple-bg: #efeafe;
  --ink: #17212b; --muted: #5d6b78; --line: #e3e8ee; --bg: #f5f7fa; --card: #fff;
  --radius: 14px; --shadow: 0 1px 2px rgba(16,32,48,.06), 0 4px 16px rgba(16,32,48,.05);
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Arial, sans-serif; color: var(--ink); background: var(--bg); }
button { font: inherit; cursor: pointer; }
a { color: var(--blue); }
.top { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line); }
.top-in { max-width: 1280px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.brand img { height: 40px; width: auto; display: block; }
.brand span { color: var(--muted); border-left: 1px solid var(--line); padding-left: 12px; font-weight: 600; white-space: nowrap; }
.spacer { flex: 1; }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { white-space: nowrap; border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 13px; }
.seg button.on { background: var(--navy); color: #fff; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--navy); display: grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--sky); }
.icon-btn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.who { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 4px; background: #fff; }
.av { width: 30px; height: 30px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.av.it { background: var(--violet); }
.who b { font-size: 13px; display: block; line-height: 1.1; } .who small { color: var(--muted); font-size: 11px; }
main { max-width: 1280px; margin: 0 auto; padding: 24px 20px 48px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
h1 { font-size: 28px; margin: 0 0 4px; color: var(--navy); letter-spacing: -.3px; }
h2 { font-size: 15px; margin: 0 0 12px; color: var(--navy); }
h3 { font-size: 14px; margin: 0 0 8px; color: var(--navy); }
.sub { color: var(--muted); margin: 0 0 18px; }
.pad { padding: 20px; }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0; margin: 0; }
.pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; white-space: nowrap; display: inline-block; }
.pill.ok { background: var(--green-bg); color: var(--green); } .pill.run { background: var(--sky); color: var(--blue); }
.pill.warn { background: var(--amber-bg); color: var(--amber); } .pill.bad { background: var(--red-bg); color: var(--red); }
.pill.grey { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.btn { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.go { background: var(--green); border-color: var(--green); color: #fff; }
.btn.no { color: var(--red); }
.hero { padding: 28px; background: linear-gradient(135deg, #0b2c4d, #0a5c9e); color: #fff; border: 0; }
.hero h1 { color: #fff; } .hero .sub { color: #cfe3f3; }
.ask { display: flex; gap: 8px; background: #fff; border-radius: 12px; padding: 6px; }
.ask input { flex: 1; border: 0; outline: 0; font: inherit; font-size: 16px; padding: 10px 12px; min-width: 0; }
.ask button { border: 0; background: var(--green); color: #fff; border-radius: 9px; padding: 0 20px; font-weight: 600; }
.ask button:disabled { opacity: .6; cursor: default; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.chip { border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.1); color: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.chip:hover { background: rgba(255,255,255,.2); }
.thread { margin-top: 14px; display: grid; gap: 8px; }
.msg { max-width: 80%; padding: 9px 13px; border-radius: 12px; font-size: 14px; }
.msg.me { justify-self: end; background: rgba(255,255,255,.18); color: #fff; }
.msg.bot { background: #fff; color: var(--ink); justify-self: start; }
.msg.typing { color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1.6fr; gap: 20px; margin-top: 20px; align-items: start; }
.alert { border-radius: 12px; padding: 14px; margin-bottom: 10px; border: 1px solid; }
.alert.high { background: var(--red-bg); border-color: #f4c7c2; }
.alert.medium { background: var(--amber-bg); border-color: #f3dcb2; }
.alert b { display: block; margin-bottom: 2px; }
.alert p { margin: 0 0 10px; font-size: 14px; color: #3a4652; }
.alert .row { display: flex; gap: 8px; }
.req { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
.req-h { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.req-h b { font-size: 15px; } .req-h small { color: var(--muted); white-space: nowrap; }
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 12px 0 10px; }
.steps div { text-align: center; font-size: 12px; color: var(--muted); line-height: 1.3; }
.steps i { display: block; height: 6px; border-radius: 3px; background: var(--line); margin-bottom: 5px; }
.steps .on i { background: var(--green); } .steps .now i { background: var(--blue); animation: pulse 1.2s infinite; }
.steps .warn i { background: var(--amber); }
.steps .on, .steps .now, .steps .warn { color: var(--ink); font-weight: 600; }
@keyframes pulse { 50% { opacity: .45; } }
.journey { list-style: none; margin: 0; padding: 0; border-top: 1px dashed var(--line); padding-top: 8px; }
.journey li { display: flex; gap: 10px; font-size: 14px; padding: 3px 0; color: #3a4652; }
.journey li time { color: var(--muted); font-size: 12px; min-width: 62px; padding-top: 2px; }
.journey li:last-child { color: var(--ink); font-weight: 600; }
details.more summary { cursor: pointer; color: var(--blue); font-size: 13px; margin-top: 4px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
.kpi { padding: 16px 18px; }
.kpi small { color: var(--muted); font-size: 13px; } .kpi b { display: block; font-size: 28px; color: var(--navy); }
.kpi.attn { border-color: #f3dcb2; background: var(--amber-bg); }
.banner { display: flex; align-items: center; gap: 12px; justify-content: space-between; border: 1px solid #f3dcb2; background: var(--amber-bg); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
.tk { display: block; cursor: pointer; width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
.tk.sel { border-color: var(--blue); box-shadow: 0 0 0 3px var(--sky); }
.tk-h { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.tk-h a { font-weight: 700; text-decoration: none; } .tk-h a:hover { text-decoration: underline; }
.tk p { margin: 4px 0 0; font-size: 14px; } .tk small { color: var(--muted); }
.quote { background: var(--bg); border-radius: 10px; padding: 10px 14px; margin: 10px 0 16px; font-size: 14px; }
.quote small { display: block; color: var(--muted); font-size: 12px; }
.panel { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.panel-h { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; margin-bottom: 8px; }
.panel-h h3 { margin: 0; } .panel-h small { color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.fact { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--muted); }
.fact b { display: block; font-size: 16px; color: var(--navy); }
.fact.bad b { color: var(--red); } .fact.good b { color: var(--green); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); padding: 6px 8px; }
.tbl td { border-bottom: 1px solid var(--line); padding: 6px 8px; }
.tbl tr.marker td { background: var(--sky); color: var(--blue); font-weight: 600; }
.tbl-wrap { overflow-x: auto; }
.logbox { background: #0f1b27; color: #c9d6e2; border-radius: 10px; padding: 10px 12px; font: 12px/1.5 Consolas, "Cascadia Mono", monospace; overflow: auto; white-space: pre; max-height: 230px; }
.logbox .e { color: #ff8a80; } .logbox .w { color: #ffd180; } .logbox .i { color: #a5d6a7; }
.chart { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.stack { display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: var(--line); }
.stack span { height: 100%; }
.cmp { display: grid; grid-template-columns: 60px 1fr 60px; gap: 8px; align-items: center; font-size: 13px; margin: 6px 0; }
.pipe { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
.node { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 6px; text-align: center; font-size: 11.5px; line-height: 1.25; min-height: 74px; }
.node:hover { border-color: var(--blue); }
.node .ic { width: 24px; height: 24px; border-radius: 50%; margin: 0 auto 5px; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--line); color: var(--muted); }
.node b { display: block; font-size: 12px; color: var(--ink); }
.node small { color: var(--muted); font-size: 10.5px; }
.node.done .ic { background: var(--green); color: #fff; }
.node.running { border-color: var(--blue); box-shadow: 0 0 0 3px var(--sky); }
.node.running .ic { background: var(--blue); color: #fff; animation: pulse 1s infinite; }
.node.waiting { border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-bg); }
.node.waiting .ic { background: var(--amber); color: #fff; animation: pulse 1s infinite; }
.node.warn .ic { background: var(--amber); color: #fff; } .node.fail .ic { background: var(--red); color: #fff; }
.node.skipped, .node.na { opacity: .5; }
.node.sel { outline: 2px solid var(--navy); outline-offset: 1px; }
.stage { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 18px; }
.stage-h { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.stage-h h3 { margin: 0; font-size: 16px; }
.stage-h p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.eng { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; }
.eng.ai { background: var(--violet-bg); color: var(--violet); } .eng.rules { background: var(--amber-bg); color: var(--amber); }
.eng.tool { background: var(--sky); color: var(--blue); } .eng.alert { background: var(--red-bg); color: var(--red); }
.eng.human { background: var(--green-bg); color: var(--green); } .eng.policy { background: var(--bg); color: var(--muted); }
.approve-box { margin-top: 12px; border: 1px solid #f3dcb2; background: var(--amber-bg); border-radius: 10px; padding: 12px 14px; }
.approve-box .row { display: flex; gap: 8px; margin-top: 8px; }
.kv { display: grid; grid-template-columns: 190px 1fr; gap: 4px 14px; font-size: 13.5px; margin-top: 10px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-word; }
.kv ul { margin: 0; padding-left: 18px; }
.sec { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 14px 0 0; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tools span { font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
.note { border-left: 3px solid var(--blue); background: #f8fafc; padding: 10px 12px; border-radius: 0 8px 8px 0; margin-bottom: 8px; font-size: 13px; white-space: pre-wrap; }
.note.c { border-color: var(--green); }
.note small { display: block; color: var(--muted); margin-bottom: 4px; white-space: normal; }
details.notes summary { cursor: pointer; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
.side { display: grid; gap: 20px; margin-top: 20px; grid-template-columns: 1fr 1.3fr 1fr; }
.bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin: 8px 0 6px; }
.bar i { display: block; height: 100%; background: var(--green); transition: width .6s; }
.bar.hot i { background: var(--red); } .bar.warm i { background: var(--amber); }
.sys { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.sys:last-child { border: 0; } .sys span { color: var(--muted); text-align: right; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; }
.dot.off { background: var(--amber); }
details.demo summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.demo-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 90vw; }
.toast.on { opacity: 1; }
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 0 24px; }
@media (max-width: 1100px) { .side { grid-template-columns: 1fr; } }
@media (max-width: 860px) {
  .grid2 { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .pipe { grid-template-columns: repeat(2, 1fr); }
  .brand span, .who small, .who span b { display: none; }
  .top-in { padding: 10px 16px; gap: 8px; } main { padding: 16px; }
  .brand img { height: 30px; }
  .msg { max-width: 92%; }
  .kv { grid-template-columns: 1fr; } .kv dt { margin-top: 6px; }
  .steps div { font-size: 10.5px; }
}
.kpis6 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpis7 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stages5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 10px; }
.stage-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.stage-card b { font-size: 13px; color: var(--navy); }
/* AURA predictive-intelligence shell: navy sidebar for the IT view only */
.shell { display: flex; align-items: flex-start; }
.shell > #main { flex: 1 1 auto; min-width: 0; }
.sidebar { display: none; }
.shell.itview .sidebar { display: block; width: 232px; flex: none; background: var(--navy); min-height: calc(100vh - 62px); position: sticky; top: 62px; padding: 16px 0 24px; }
.shell.itview main#main { max-width: none; margin: 0; flex: 1; min-width: 0; padding: 24px 24px 48px; }
.side-grp { padding: 16px 18px 6px; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: #8fa6bd; }
.side-link { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: #cfe0ef; padding: 9px 18px; font-size: 13.5px; font-weight: 600; border-left: 3px solid transparent; }
.side-link:hover { background: rgba(255,255,255,.07); color: #fff; }
.side-link.on { background: rgba(255,255,255,.1); color: #fff; border-left-color: var(--purple); }
.kpi.click { cursor: pointer; }
.pi2-backdrop { position: fixed; inset: 0; background: rgba(10,20,35,.4); z-index: 50; }
.pi2-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 92vw); background: #fff; box-shadow: -8px 0 24px rgba(10,20,35,.2); overflow: auto; padding: 20px; z-index: 51; }
.pipeline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
.pipeline .pstage { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); background: #f1f3f6; border-radius: 999px; padding: 4px 11px 4px 6px; }
.pipeline .pstage.done { color: var(--green); background: var(--green-bg); }
.pipeline .pstage i { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 9.5px; font-style: normal; border: 1.5px solid currentColor; flex: none; }
.pipeline .arrow { color: #b8c1cc; font-size: 12px; }
.pi-tabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 18px; }
.pi-tab { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 12px; color: var(--ink); box-shadow: var(--shadow); }
.pi-tab:hover { border-color: #b9c6d4; }
.pi-tab b { display: block; font-size: 13px; }
.pi-tab span { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.3; }
.pi-tab span i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.pi-tab.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.pi-tab.on span { color: #cfe0ef; }
.pi-body h1 { font-size: 20px; }
.pi-body > .sub:first-of-type { margin-bottom: 14px; }
.sig-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.sig-card { border-top: 3px solid; cursor: pointer; padding: 14px 16px; }
.sig-card:hover { box-shadow: 0 0 0 3px var(--sky); }
.fac-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.fac-bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 10px 0 6px; }
.fac-bar i { display: block; height: 100%; border-radius: 3px; }
.wt { font: 11px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--muted); white-space: nowrap; }
.eyebrow { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.notif { border-left: 4px solid; padding: 16px 18px; margin-bottom: 12px; }
.map-canvas { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #fff; }
.map-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 12.5px; margin-top: 12px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fafbfd; }
.map-legend .sep { width: 1px; height: 18px; background: var(--line); }
.map-note { margin-top: 10px; padding: 10px 14px; border-radius: 12px; background: var(--purple-bg); color: #3a2b8f; font-size: 13px; }
.dep-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.dep-table th { text-align: left; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 2px solid var(--line); white-space: nowrap; }
.dep-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--blue); font-weight: 600; text-align: left; }
#pi2map-card:fullscreen { overflow: auto; border-radius: 0; background: #fff; }
#pi2map-card:fullscreen #pi2map-svg { height: calc(100vh - 240px); }
.esc-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 12px; }
.esc-step { border-top: 4px solid var(--line); padding-top: 8px; }
.esc-step.on { border-top-color: var(--purple); }
.chain { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.chain > div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
@media (max-width: 860px) {
  .kpis6, .kpis7 { grid-template-columns: repeat(2, 1fr); }
  .stages5 { grid-template-columns: 1fr; }
  .shell.itview .sidebar { position: static; width: 100%; min-height: 0; display: flex; flex-wrap: wrap; padding: 10px; }
  .shell.itview { flex-direction: column; }
  .side-grp { display: none; }
  .side-link { width: auto; border-left: 0; border-radius: 999px; padding: 6px 12px; }
  .pi2-drawer { width: 100vw; }
}
/* Workforce Identity & SSO */
.sso-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 18px; }

  </section>
  ${knewHtml}
  <div class="grid2" style="margin:0 0 20px">
    <section class="card pad"><h2>Cascade timeline</h2>${Object.keys(ev).sort((a, b) => a - b).map((s) => `<div style="display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)"><b style="flex:none;width:44px;font-size:12.5px;color:var(--muted)">${pi2Clock(+s)}</b><div style="font-size:13px;line-height:1.6">${ev[s].join("<br>")}</div></div>`).join("")}</section>
    <section class="card pad"><h2>What's driving the risk</h2>
      ${drivers.map((f) => `<div style="padding:6px 0;border-bottom:1px solid var(--line);font-size:13px"><div style="display:flex;justify-content:space-between"><b>${esc(f.label)}</b><span>${f.pts} pts</span></div><small style="color:var(--muted)">${esc(f.evidence)}</small></div>`).join("")}
      <button class="btn" style="margin-top:10px" data-pi-tab="risk">See all factors</button>
      <h2 style="margin-top:18px">Ruled out</h2>
      <ul style="margin:0;padding-left:18px;font-size:13px">${scn.ruledOut.map((r) => `<li style="margin-bottom:4px"><b>${esc(PI2_NODES[r.id].label)}</b>: ${esc(r.reason)}</li>`).join("")}</ul>
    </section>
  </div>`;
}
function pi2ImpactTab(o) {
  const scn = PI2_SCENARIOS[PI2.scenario], step = PI2.step, statuses = pi2AllStatuses(scn, step);
  const ops = Object.keys(PI2_NODES).filter((id) => PI2_NODES[id].layer === 3).map((id) => ({ id, st: pi2RollupStatus(scn, step, id) })).sort((a, b) => PI2_SEV_RANK[b.st] - PI2_SEV_RANK[a.st]);
  const atRisk = ops.filter((x) => x.st !== "normal"), branches = atRisk.reduce((a, x) => a + (PI2_BIZ_BRANCHES[x.id] || 0), 0);
  const apps = Object.keys(PI2_NODES).filter((id) => PI2_NODES[id].layer === 2);
  return `<h1>Business impact</h1><p class="sub">What the degradation means for Crystal Clean's field and facility operations. The application-to-operation relationships and branch counts are illustrative POC assumptions, not verified internal architecture.</p>
  <div class="kpis">
    <div class="card kpi"><small>Operations exposed</small><b style="${atRisk.length ? `color:${CX_COLOR.warning}` : ""}">${atRisk.length} / 7</b></div>
    <div class="card kpi"><small>Branches potentially affected</small><b>~${branches}</b></div>
    <div class="card kpi"><small>Applications degraded</small><b>${apps.filter((id) => statuses[id] !== "normal").length} / ${apps.length}</b></div>
    <div class="card kpi"><small>Risk score</small><b style="color:${riskColor(pi2Class(pi2Score(scn, step, o)))}">${pi2Score(scn, step, o)}</b></div>
  </div>
  ${atRisk.length ? `<section class="card pad" style="margin-bottom:20px;border-left:4px solid ${CX_COLOR.warning}"><h2 style="margin-bottom:4px">Potential business impact</h2><p style="margin:0;font-size:14px">${esc(scn.businessImpact)}</p></section>` : ""}
  <section class="card pad"><h2>Crystal Clean business operations</h2>
    ${ops.map((x) => { const n = PI2_NODES[x.id]; return `<div data-pi2-open="node:${esc(x.id)}" style="cursor:pointer;display:grid;grid-template-columns:minmax(0,1.1fr) auto minmax(0,2fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px">
      <b>${esc(n.label)}</b><span class="pill" style="background:${CX_BG[x.st]};color:${CX_COLOR[x.st]}">${esc(x.st)}</span>
      <span>${x.st === "normal" ? `<span style="color:var(--muted)">Operating normally.</span>` : esc(PI2_BIZ_EFFECT[x.id])}<br><small style="color:var(--muted)">Relies on ${n.deps.map((d) => `${esc(PI2_NODES[d].label)} (<span style="color:${CX_COLOR[statuses[d]]}">${esc(statuses[d])}</span>)`).join(", ")}</small></span>
      <span style="white-space:nowrap;color:var(--muted)">~${PI2_BIZ_BRANCHES[x.id]} branches</span></div>`; }).join("")}
  </section>`;
}
function pi2NotifyTab(o) {
  const scn = PI2_SCENARIOS[PI2.scenario], step = PI2.step, list = pi2Notifs(scn, step), root = PI2_NODES[scn.root].label;
  return `<h1>Notification centre</h1><p class="sub">${list.length} alert(s) for "${esc(scn.title)}". Shown inside the POC only: no email, Teams, SMS or push delivery. Branches are notified only once a component goes critical.</p>
  ${list.length ? list.map((n) => {
    const node = PI2_NODES[n.id], sev = n.resolved ? "normal" : n.st;
    const chip = n.resolved ? "Resolved" : n.st === "critical" ? "Critical" : "Early warning";
    const prio = n.cls === "Critical" ? 1 : n.cls === "High" ? 2 : n.cls === "Moderate" ? 3 : 4;
    const title = n.isRoot ? `Likely root cause: ${node.label} disruption` : `${node.label} ${n.resolved ? "recovered" : n.st === "critical" ? "failing" : "degrading"} downstream of ${root}`;
    return `<div class="card notif" style="border-left-color:${CX_COLOR[sev]}">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">
        <span class="eyebrow">IT alert · ${esc(node.cat)} · ${n.resolved ? "resolved" : `${prio} - ${esc(n.cls)}`}</span>
        <span style="display:flex;gap:8px;align-items:center"><span class="pill" style="background:${CX_BG[sev]};color:${CX_COLOR[sev]}">${chip}</span><small style="color:var(--muted)">${pi2Clock(n.since)}</small></span>
      </div>
      <h2 style="margin:6px 0 4px;font-size:16px;color:var(--ink)">${esc(title)}${n.resolved ? "" : ` (risk ${n.risk}/100)`}</h2>
      <p style="margin:0;font-size:13px;color:var(--muted)">${n.notified ? `Branches notified: <b style="color:var(--ink)">~${n.branches}</b> across ${n.ops.length} operation(s): ${esc(n.ops.map((b) => PI2_NODES[b].label).join(", "))}` : "Branches not notified (below the branch threshold: not critical)"}</p>${pi2NotifLead(scn, n)}
      <div class="pipeline">${n.stages.map(([l, d], i) => `${i ? '<span class="arrow">→</span>' : ""}<span class="pstage ${d ? "done" : ""}">${d ? "<i>✓</i>" : ""}${esc(l)}</span>`).join("")}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${n.rec.ack || n.resolved ? "" : `<button class="btn primary" data-pi2-notif="ack:${esc(n.key)}">Acknowledge</button>`}
        ${n.rec.inv || n.resolved ? "" : `<button class="btn" data-pi2-notif="inv:${esc(n.key)}">Start investigation</button>`}
        <button class="btn" data-pi2-notif="map:${esc(n.id)}">Show on dependency map</button>
      </div></div>`;
  }).join("") : `<div class="card pad"><p class="empty" style="padding:0">No alerts yet. Start the simulation above and alerts appear here as components degrade.</p></div>`}`;
}



function renderIt() {
  if (PI2MAP_DRAG) return;
  const fs = document.fullscreenElement;
  if (fs && fs.id === "pi2map-card") { fs.innerHTML = pi2MapCardInner({}); pi2MapBind(); return; }
  const searchEl = document.getElementById("pi2map-search");
  const hadFocus = !!(searchEl && document.activeElement === searchEl), caret = hadFocus ? searchEl.selectionStart : null;
  $("#main").innerHTML = piWorkspace({}) + pi2Drawer({});
  if (S.piTab === "map") {
    pi2MapBind();
    const el = document.getElementById("pi2map-search");
    if (hadFocus && el) { el.focus(); if (caret != null) el.setSelectionRange(caret, caret); }
  }
}
function paintIt() { const y = window.scrollY; renderIt(); window.scrollTo(0, y); }
document.addEventListener("click", (ev) => {
  if (ev.target.closest("a") || ev.target.closest("summary")) return;
  const pmn = ev.target.closest("[data-pi2map-node]");
  if (pmn) {
    if (PI2MAP_JUST_DRAGGED) { PI2MAP_JUST_DRAGGED = false; return; }
    pi2MapState().selected = pmn.dataset.pi2mapNode;
    PI2.drawer = { kind: "node", key: pmn.dataset.pi2mapNode }; pi2Save(); return renderIt();
  }
  const po = ev.target.closest("[data-pi2-open]");
  if (po) { const [kind, key] = po.dataset.pi2Open.split(":"); PI2.drawer = { kind, key }; pi2Save(); return renderIt(); }
  if (ev.target.closest("[data-pi2-close]")) { PI2.drawer = null; pi2Save(); return renderIt(); }
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.piTab) { S.piTab = b.dataset.piTab; store.set("cc.pitab", S.piTab); S.itPage = "predictive"; store.set("cc.itpage", "predictive"); S.piView = "model"; store.set("cc.piview", "model"); PI2.drawer = null; PI2MAP_DRAG = null; pi2Save(); window.scrollTo({ top: 0 }); return renderIt(); }
  if (b.dataset.pi2Notif) {
    const v = b.dataset.pi2Notif, i = v.indexOf(":"), act = v.slice(0, i), arg = v.slice(i + 1);
    PI2.notif = PI2.notif || {};
    if (act === "ack") PI2.notif[arg] = { ...(PI2.notif[arg] || {}), ack: true };
    else if (act === "inv") { PI2.notif[arg] = { ...(PI2.notif[arg] || {}), ack: true, inv: true }; S.piTab = "causal"; toast("Investigation started for this alert."); }
    else if (act === "map") { const M = pi2MapState(); M.selected = arg; M.mode = "overview"; M.trace = false; S.piTab = "map"; PI2.drawer = { kind: "node", key: arg }; }
    store.set("cc.pitab", S.piTab); pi2Save(); return renderIt();
  }
  if (b.dataset.pi2) return pi2Control(b.dataset.pi2);
  if (b.dataset.pi2wi) return pi2WhatIfControl(b.dataset.pi2wi);
  if (b.dataset.pi2map) {
    const v = b.dataset.pi2map, M = pi2MapState();
    if (v === "fullscreen") { const c = document.getElementById("pi2map-card"); if (document.fullscreenElement) document.exitFullscreen(); else if (c && c.requestFullscreen) c.requestFullscreen(); return; }
    if (v === "download") return pi2MapDownload();
    if (v === "zoomin") pi2MapZoomBy(1.25);
    else if (v === "zoomout") pi2MapZoomBy(0.8);
    else if (v === "reset") pi2MapReset();
    else if (v === "trace") M.trace = !M.trace;
    else if (v === "clear") { M.selected = null; PI2.drawer = null; }
    else if (v.startsWith("mode-")) { M.mode = v.slice(5); M.trace = false; }
    else if (v.startsWith("view-")) { M.view = v.slice(5); pi2MapReset(); }
    return renderIt();
  }
  if (b.dataset.pi2mapFilter) { pi2MapToggleFilter(b.dataset.pi2mapFilter); return renderIt(); }
});
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) renderIt(); });
setInterval(() => {
  let changed = false;
  if (PI2.running && PI2.step < 4) { PI2.step++; PI2.peak = Math.max(PI2.peak || 0, PI2.step); changed = true; if (PI2.step >= 4) PI2.running = false; }
  else if (PI2.recovering) { if (PI2.step > 0) { PI2.step--; changed = true; } else { PI2.recovering = false; PI2.applied[PI2.scenario] = true; PI2.autoRemediations = (PI2.autoRemediations || 0) + 1; changed = true; } }
  if (changed) { pi2Save(); if (S.view === "it") paintIt(); }
}, 1500);
renderIt();
</script>
</body>
