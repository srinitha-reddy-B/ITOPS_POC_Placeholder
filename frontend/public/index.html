<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tachyon Aura Agent Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F6F5; --surface:#FFFFFF; --surface-tint:#F6FAF9;
    --ink:#10181D; --ink-muted:#4E6360; --ink-faint:#879995;
    --accent:#1F6F63; --accent-ink:#144A40; --accent-soft:#DCEEE8; --accent-glow:rgba(31,111,99,.16);
    --warn:#AD611E; --warn-soft:#F6E6D2; --warn-ink:#763F11;
    --line:#DCE5E1; --line-strong:#C0CDC8; --code-bg:#E9F1EE;
    --shadow-sm:0 1px 2px rgba(16,24,29,.05);
    --shadow-md:0 6px 20px -6px rgba(16,24,29,.14);
    --font-display:"Sora",-apple-system,sans-serif;
    --font-body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --font-mono:"IBM Plex Mono","Cascadia Code",Consolas,monospace;
    --sf:#2E7DD1; --db:#E1622C; --sn:#189AB4; --svn:#2E7D5B; --m365:#7B5EA7; --human:#AD611E;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); height:100vh; overflow:hidden; -webkit-font-smoothing:antialiased;}
  .shell{display:grid; grid-template-columns:1.35fr 1fr; gap:1px; height:100vh; background:var(--line);}
  .pane{background:var(--surface); display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden;}

  header{padding:14px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; background:var(--surface);}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg,var(--accent),var(--accent-ink)); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:0.95rem; letter-spacing:0.02em; box-shadow:var(--shadow-sm);}
  .brand-text h1{font-family:var(--font-display); font-size:1.02rem; font-weight:700; margin:0; letter-spacing:-0.01em;}
  .brand-text h1 .sub{color:var(--accent-ink); font-weight:600;}
  .brand-text .tagline{margin:1px 0 0; font-size:0.72rem; color:var(--ink-faint);}
  .phase{font-family:var(--font-mono); font-size:0.68rem; letter-spacing:0.03em; text-transform:uppercase; color:var(--accent-ink); background:var(--accent-soft); padding:4px 10px; border-radius:20px; font-weight:500;}

  .agent-chat-header{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 22px; background:var(--accent-soft); border-bottom:1px solid var(--line); font-size:0.86rem;}
  .agent-chat-header .who{display:flex; align-items:center; gap:10px;}
  .agent-chat-header .who b{color:var(--accent-ink); font-size:0.94rem; font-weight:600;}
  .agent-chat-header .who span{display:block; font-size:0.72rem; color:var(--ink-muted); margin-top:1px;}
  .agent-chat-header button{padding:6px 12px; font-size:0.76rem; background:var(--surface); color:var(--accent-ink); border:1px solid var(--accent); border-radius:7px; cursor:pointer; font-family:var(--font-body); font-weight:500;}
  .agent-chat-header button:hover{background:var(--accent); color:#fff;}

  .messages{flex:1; overflow-y:auto; padding:20px 22px; display:flex; flex-direction:column; gap:14px;}
  .msg-row{display:flex; gap:10px; max-width:88%; animation:rise .18s ease-out;}
  .msg-row.user{align-self:flex-end; flex-direction:row-reverse;}
  .msg-row.bot{align-self:flex-start;}
  @keyframes rise{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  .avatar{flex:0 0 auto; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-display); font-size:0.68rem; font-weight:700; margin-top:2px; box-shadow:var(--shadow-sm);}
  .msg{padding:11px 15px; border-radius:14px; font-size:0.92rem; line-height:1.55; white-space:pre-wrap; box-shadow:var(--shadow-sm);}
  .msg.user{background:var(--accent); color:#fff; border-radius:14px 14px 4px 14px;}
  .msg.bot{background:var(--surface-tint); border:1px solid var(--line); color:var(--ink); border-radius:14px 14px 14px 4px;}
  .msg.typing{display:flex; gap:4px; align-items:center; padding:13px 16px;}
  .msg.typing span{width:6px; height:6px; border-radius:50%; background:var(--ink-faint); animation:pulse 1.1s infinite ease-in-out;}
  .msg.typing span:nth-child(2){animation-delay:.15s;} .msg.typing span:nth-child(3){animation-delay:.3s;}
  @keyframes pulse{0%,80%,100%{opacity:.25; transform:scale(0.85);} 40%{opacity:1; transform:scale(1);}}
  @media (prefers-reduced-motion:reduce){.msg-row{animation:none;} .msg.typing span{animation:none; opacity:.6;}}

  .connect-btn{display:inline-block; margin-top:10px; padding:8px 15px; background:var(--accent); color:#fff; border-radius:8px; font-size:0.85rem; font-weight:600; text-decoration:none; border:none; cursor:pointer; font-family:var(--font-body);}
  .connect-btn:hover{background:var(--accent-ink);}
  .connect-btn:disabled{opacity:.55; cursor:default;}
  .connect-form{margin-top:10px; padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; gap:9px; max-width:320px; box-shadow:var(--shadow-sm);}
  .connect-form label{font-size:0.78rem; color:var(--ink-muted); display:flex; flex-direction:column; gap:4px; font-weight:500;}
  .connect-form label.checkbox{flex-direction:row; align-items:center; gap:6px;}
  .connect-form input[type=text], .connect-form input[type=password]{padding:8px 10px; border:1px solid var(--line-strong); border-radius:7px; font-size:0.85rem; background:var(--surface); color:var(--ink); width:100%; font-family:var(--font-body);}
  .connect-form input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .action-group{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .action-group .connect-form, .action-group .connect-btn{margin-top:0;}
  .action-group > *:not(:first-child){padding-top:10px; border-top:1px dashed var(--line);}

  form#form{display:flex; gap:10px; padding:16px 22px; border-top:1px solid var(--line); background:var(--surface);}
  form#form input[type=text]{flex:1; padding:11px 14px; border:1px solid var(--line-strong); border-radius:10px; font-size:0.92rem; background:var(--surface-tint); color:var(--ink); font-family:var(--font-body);}
  form#form input[type=text]:focus{outline:2px solid var(--accent); outline-offset:1px; background:var(--surface);}
  form#form button{background:var(--accent); color:#fff; border:none; padding:11px 20px; border-radius:10px; font-size:0.9rem; font-weight:600; cursor:pointer; font-family:var(--font-body);}
  form#form button:hover{background:var(--accent-ink);}

  .side{overflow-y:auto; padding:20px 22px;}
  .side h2{font-family:var(--font-display); font-size:0.82rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin:0 0 12px; display:flex; align-items:center; justify-content:space-between; font-weight:700;}
  .side h2:not(:first-child){margin-top:26px;}
  .side h2 .meta{font-family:var(--font-mono); font-size:0.68rem; text-transform:none; letter-spacing:0; color:var(--ink-faint); font-weight:400;}
  .agent-card{border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:14px 16px; margin-bottom:12px; font-size:0.86rem; box-shadow:var(--shadow-sm);}
  .agent-card .head{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .agent-card .head .dot{width:22px; height:22px; border-radius:50%; flex:0 0 auto; color:#fff; font-family:var(--font-display); font-size:0.6rem; font-weight:700; display:flex; align-items:center; justify-content:center;}
  .agent-card .head .name{font-weight:600; flex:1;}
  .agent-card .head .platform{font-family:var(--font-mono); font-size:0.68rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.03em;}
  .agent-card .role{color:var(--ink-muted); font-size:0.82rem; margin:2px 0 8px;}
  .agent-card .rule{color:var(--warn-ink); font-size:0.78rem; margin-top:3px; padding-left:2px;}
  .agent-card.clickable{cursor:pointer; transition:border-color .12s, box-shadow .12s, transform .12s;}
  .agent-card.clickable:hover{border-color:var(--accent); box-shadow:var(--shadow-md); transform:translateY(-1px);}
  .agent-card.focused{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-glow);}
  .status{font-size:0.66rem; text-transform:uppercase; letter-spacing:0.04em; padding:3px 8px; border-radius:20px; font-weight:600;}
  .status.connected{background:#DCEEE8; color:#144A40;}
  .status.mock{background:var(--line); color:var(--ink-muted);}
  .status.needs-connection{background:var(--warn-soft); color:var(--warn-ink);}
  .status.n-a{display:none;}
  .open-chat-hint{font-size:0.72rem; color:var(--accent-ink); margin-top:8px; font-weight:600;}
  .empty{color:var(--ink-faint); font-size:0.85rem;}

  .trace{display:flex; flex-direction:column; gap:8px;}
  .ev{border-left:3px solid var(--accent); background:var(--surface); border:1px solid var(--line); border-left-width:3px; border-radius:0 10px 10px 0; padding:9px 12px; font-size:0.8rem; box-shadow:var(--shadow-sm);}
  .ev.blocked{border-left-color:var(--warn); background:var(--warn-soft);}
  .ev .top{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:0.7rem; color:var(--ink-faint); margin-bottom:3px;}
  .ev .agent{font-weight:600; color:var(--ink);}
  .ev .detail{color:var(--ink-muted); word-break:break-word; font-family:var(--font-mono); font-size:0.76rem; margin-top:2px;}
  .ev .decision{color:var(--accent-ink); font-size:0.75rem; margin-top:4px;}
</style>
</head>
<body>
<div class="shell">
  <section class="pane">
    <header>
      <div class="brand">
        <div class="brand-mark">TA</div>
        <div class="brand-text">
          <h1>Tachyon <span class="sub">Aura Agent Factory</span></h1>
          <p class="tagline">Describe a process. Approve the agents. Watch them work.</p>
        </div>
      </div>
      <span class="phase" id="phase">gather</span>
    </header>
    <div class="agent-chat-header" id="agentChatHeader" style="display:none;">
      <div class="who"><b id="agentChatName"></b><span id="agentChatPlatform"></span></div>
      <button type="button" id="backToRootBtn">← All agents / Root Orchestrator</button>
    </div>
    <div class="messages" id="messages"></div>
    <form id="form">
      <input type="text" id="input" placeholder="Describe a process, paste an SOP, or ask the live agents something…" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </section>
  <section class="pane side">
    <h2>Agents <span class="meta" id="blueprintMeta"></span></h2>
    <div id="blueprint"><p class="empty">Nothing built yet.</p></div>
    <h2>Trace &amp; log</h2>
    <div class="trace" id="trace"><p class="empty">No agent activity yet.</p></div>
  </section>
</div>

<script>
let sessionId = null;
let focusedAgent = null;      // null = Root Orchestrator chat; else = that agent's own chat
let lastBlueprint = null;
let rootHistory = [];         // [{text, who, action}] -- the Root Orchestrator's own thread
const agentHistories = {};    // agentName -> [{text, who, action}] -- each agent's own dedicated thread

const messagesEl = document.getElementById('messages');
const phaseEl = document.getElementById('phase');
const blueprintEl = document.getElementById('blueprint');
const blueprintMetaEl = document.getElementById('blueprintMeta');
const traceEl = document.getElementById('trace');
const agentChatHeaderEl = document.getElementById('agentChatHeader');
const agentChatNameEl = document.getElementById('agentChatName');
const agentChatPlatformEl = document.getElementById('agentChatPlatform');
const inputEl = document.getElementById('input');

const PLATFORM_COLORS = {
  salesforce: 'var(--sf)', databricks: 'var(--db)', snowflake: 'var(--sn)',
  servicenow: 'var(--svn)', m365: 'var(--m365)', human: 'var(--human)',
};

function avatarStyle(who, text) {
  if (who === 'user') return { initials: 'YOU', bg: 'var(--ink-faint)' };
  const m = /\bvia (Salesforce|Databricks|Snowflake|Servicenow|M365|Human)\b/i.exec(text || '');
  const platform = m ? m[1].toLowerCase() : null;
  const bg = PLATFORM_COLORS[platform] || 'var(--accent)';
  const initials = platform ? platform.slice(0, 2).toUpperCase() : 'TA';
  return { initials, bg };
}

function currentHistory() {
  if (!focusedAgent) return rootHistory;
  return agentHistories[focusedAgent] || (agentHistories[focusedAgent] = []);
}

function redrawMessages() {
  messagesEl.innerHTML = '';
  for (const m of currentHistory()) renderMessageBubble(m.text, m.who, m.action);
}

// Opens a real, separate chat for one specific agent -- its own message
// history, its own header, and every message bypasses auto-routing
// entirely (agent_name is sent straight through to that agent server-side).
function openAgentChat(name, platform) {
  focusedAgent = name;
  agentChatHeaderEl.style.display = 'flex';
  agentChatNameEl.textContent = name;
  agentChatPlatformEl.textContent = platform ? platform.charAt(0).toUpperCase() + platform.slice(1) : '';
  if (!agentHistories[name]) {
    agentHistories[name] = [];
    pushMessage(`You're now chatting directly with ${name}. This bypasses auto-routing — everything you say here goes straight to this agent.`, 'bot');
  }
  redrawMessages();
  renderBlueprint(lastBlueprint);
  inputEl.focus();
}

function closeAgentChat() {
  focusedAgent = null;
  agentChatHeaderEl.style.display = 'none';
  redrawMessages();
  renderBlueprint(lastBlueprint);
}

document.getElementById('backToRootBtn').addEventListener('click', closeAgentChat);

function openPopup(url) {
  const w = 520, h = 680;
  const left = window.screenX + (window.outerWidth - w) / 2;
  const top = window.screenY + (window.outerHeight - h) / 2;
  return window.open(url, 'aura_oauth', `width=${w},height=${h},left=${left},top=${top}`);
}

// Pure DOM rendering -- does not touch history. Used both for new messages
// (via pushMessage) and when replaying a stored history on a view switch.
function renderMessageBubble(text, who, action) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + who;

  const av = avatarStyle(who, text);
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.style.background = av.bg;
  avatar.textContent = av.initials;
  row.appendChild(avatar);

  const div = document.createElement('div');
  div.className = 'msg ' + who;
  const textNode = document.createElement('div');
  textNode.textContent = text;
  div.appendChild(textNode);

  appendAction(div, action);

  row.appendChild(div);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// Renders a single action onto a message bubble. `action_group` holds
// several alternative actions (e.g. two different ways to connect the
// same platform) and just renders each of its items the same way, side
// by side, so the user can pick.
function appendAction(div, action) {
  if (!action) return;
  if (action.type === 'oauth_popup') {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'connect-btn';
    btn.textContent = action.label;
    btn.addEventListener('click', () => openPopup(action.url));
    div.appendChild(btn);
  } else if (action.type === 'form') {
    div.appendChild(buildConnectForm(action));
  } else if (action.type === 'confirm_button') {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'connect-btn';
    btn.textContent = action.label;
    btn.addEventListener('click', () => { btn.disabled = true; sendMessage(action.message); });
    div.appendChild(btn);
  } else if (action.type === 'open_link') {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'connect-btn';
    btn.textContent = action.label;
    btn.addEventListener('click', () => window.open(action.url, '_blank'));
    div.appendChild(btn);
  } else if (action.type === 'action_group') {
    const group = document.createElement('div');
    group.className = 'action-group';
    for (const item of action.items) appendAction(group, item);
    div.appendChild(group);
  }
}

// Records a new message into whichever thread is currently open (root or
// a specific agent's) and renders it immediately.
function pushMessage(text, who, action) {
  currentHistory().push({ text, who, action: action || null });
  renderMessageBubble(text, who, action);
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.id = 'typingRow';
  const av = avatarStyle('bot', focusedAgent ? `via ${''}` : '');
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.style.background = av.bg;
  avatar.textContent = av.initials;
  const bubble = document.createElement('div');
  bubble.className = 'msg bot typing';
  bubble.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(avatar);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typingRow');
  if (el) el.remove();
}

function buildConnectForm(action) {
  const form = document.createElement('form');
  form.className = 'connect-form';
  for (const f of action.fields) {
    const label = document.createElement('label');
    if (f.type === 'checkbox') {
      label.className = 'checkbox';
      label.innerHTML = `<input type="checkbox" name="${f.name}"> ${f.label}`;
    } else {
      label.innerHTML = `${f.label}<input type="${f.type}" name="${f.name}" autocomplete="off">`;
    }
    form.appendChild(label);
  }
  const submit = document.createElement('button');
  submit.type = 'submit';
  submit.className = 'connect-btn';
  submit.textContent = action.label;
  form.appendChild(submit);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fields = {};
    for (const el of form.elements) {
      if (!el.name) continue;
      fields[el.name] = el.type === 'checkbox' ? el.checked : el.value.trim();
    }
    submit.disabled = true;

    // Salesforce always leads to an OAuth popup on success. Open it now,
    // synchronously, inside this click's user-activation window -- browsers
    // block window.open() called after an awaited fetch, even though the
    // click was real. We redirect this already-open window once we know
    // the real authorize URL, which isn't subject to that restriction.
    const popup = action.platform === 'salesforce' ? openPopup('about:blank') : null;

    const res = await fetch('/api/connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, platform: action.platform, fields }),
    });
    const data = await res.json();
    form.remove();

    if (data.action && data.action.type === 'oauth_popup') {
      if (popup && !popup.closed) {
        pushMessage(data.reply, 'bot');
        popup.location = data.action.url;
      } else {
        pushMessage(data.reply + ' (your browser blocked the popup — click below instead)', 'bot', data.action);
      }
    } else {
      if (popup && !popup.closed) popup.close();
      pushMessage(data.reply, 'bot', data.action);
    }
  });
  return form;
}

window.addEventListener('message', (event) => {
  if (!event.data || !String(event.data.type || '').startsWith('aura_connect')) return;
  const ok = event.data.type === 'aura_connected';
  pushMessage(
    (ok ? `Connected to ${event.data.platform}. ` : `Connection failed: ${event.data.message} `) +
      'Ask the agent something.',
    'bot',
  );
});

function renderBlueprint(bp) {
  lastBlueprint = bp;
  const stillExists = focusedAgent && bp && bp.root_agent.participants.some(p => p.name === focusedAgent);
  if (focusedAgent && !stillExists) {
    // The blueprint changed out from under an open agent chat -- a fresh
    // proposal, an approved expansion, a lost/reset session. Drop back to
    // the Root Orchestrator instead of sending its name somewhere unknown.
    focusedAgent = null;
    agentChatHeaderEl.style.display = 'none';
    redrawMessages();
  }
  if (!bp) {
    blueprintEl.innerHTML = '<p class="empty">Nothing built yet.</p>';
    blueprintMetaEl.textContent = '';
    return;
  }
  const root = bp.root_agent;
  const live = phaseEl.textContent === 'live';

  blueprintMetaEl.textContent = `${bp.repo_name} · ${root.orchestration_class}`;
  let html = '';
  for (const p of root.participants) {
    const clickable = live && p.platform !== 'human';
    const focused = focusedAgent === p.name;
    const statusClass = (p.connection_status || 'n/a').replace(/ /g, '-').replace('/', '');
    const dotColor = PLATFORM_COLORS[p.platform] || 'var(--accent)';
    html += `<div class="agent-card ${clickable ? 'clickable' : ''} ${focused ? 'focused' : ''}" ${clickable ? `data-agent="${p.name}" data-platform="${p.platform}"` : ''}>` +
            `<div class="head"><div class="dot" style="background:${dotColor}">${p.platform.slice(0, 2).toUpperCase()}</div>` +
            `<div class="name">${p.name}</div><div class="platform">${p.platform}</div></div>` +
            `<div class="role">${p.role}</div>` +
            `<div><span class="status ${statusClass}">${p.connection_status || ''}</span></div>`;
    for (const r of (p.routing_rules || [])) {
      html += `<div class="rule">↳ ${r}</div>`;
    }
    if (clickable) {
      html += `<div class="open-chat-hint">${focused ? '● Chat open with this agent' : 'Click to open this agent\'s chat →'}</div>`;
    }
    html += `</div>`;
  }
  blueprintEl.innerHTML = html || '<p class="empty">No agents deployed yet.</p>';
}

blueprintEl.addEventListener('click', (e) => {
  const card = e.target.closest('.agent-card.clickable');
  if (!card) return;
  const name = card.dataset.agent;
  if (focusedAgent === name) { closeAgentChat(); return; }
  openAgentChat(name, card.dataset.platform);
});

function renderTrace(trace) {
  if (!trace || !trace.length) { traceEl.innerHTML = '<p class="empty">No agent activity yet.</p>'; return; }
  traceEl.innerHTML = trace.slice().reverse().map(ev => `
    <div class="ev ${ev.status === 'blocked' ? 'blocked' : ''}">
      <div class="top"><span>${ev.kind}${ev.platform ? ' · ' + ev.platform : ''}</span><span>${ev.latency_ms}ms</span></div>
      <div class="agent">${ev.agent}</div>
      <div class="detail">${ev.detail}</div>
      ${ev.decision ? `<div class="decision">${ev.decision}</div>` : ''}
    </div>
  `).join('');
}

function heuristicNote(llmMode) {
  return llmMode === 'heuristic' ? '\n\n(running in heuristic mode — set COHERE_API_KEY for full language understanding)' : '';
}

async function init() {
  const remembered = localStorage.getItem('aura_session_id');
  if (remembered) {
    const res = await fetch('/api/session/' + remembered);
    const data = await res.json();
    if (data.found) {
      sessionId = remembered;
      phaseEl.textContent = data.phase;
      renderBlueprint(data.blueprint);
      renderTrace(data.trace);
      pushMessage(data.note + heuristicNote(data.llm_mode), 'bot');
      return;
    }
  }
  const res = await fetch('/api/session', { method: 'POST' });
  const data = await res.json();
  sessionId = data.session_id;
  localStorage.setItem('aura_session_id', sessionId);
  pushMessage(data.welcome + heuristicNote(data.llm_mode), 'bot');
}

async function sendMessage(text, { showUserBubble = true } = {}) {
  if (!text || !sessionId) return;
  if (showUserBubble) pushMessage(text, 'user');
  showTyping();
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId, message: text, agent_name: focusedAgent }),
  });
  const data = await res.json();
  hideTyping();
  pushMessage(data.reply, 'bot', data.action);
  phaseEl.textContent = data.phase;
  renderBlueprint(data.blueprint);
  renderTrace(data.trace);
}

document.getElementById('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = document.getElementById('input');
  const text = input.value.trim();
  input.value = '';
  sendMessage(text);
});

init();
</script>
