<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crystal Clean Control Tower</title>
<script>
/* The app needs the portal sign-in. No session (or a stale page restored by Back) sends you to the login page. */
(function () {
  function gate() { var s = null; try { s = JSON.parse(localStorage.getItem("cc-session") || "null"); } catch (e) {} if (!s) { document.documentElement.style.visibility = "hidden"; location.replace("/portal#/login?next=" + encodeURIComponent(location.pathname + location.hash)); } }
  gate(); window.addEventListener("pageshow", function (e) { if (e.persisted) { document.body.style.opacity = ""; gate(); } });
})();
</script>
<link rel="icon" href="/crystal-clean/logo.webp">
<meta name="description" content="Standalone HTML version of the Crystal Clean Control Tower, powered by Tachyon AURA: the Digital FrontDoor employee gateway (IT Assets, IT Incidents, HR), the Incident RCA Agent, Asset Management, HR onboarding and the leadership Control Tower, on simulated data.">
<style>
:root{
  --canvas:#f4f8fb; --surface:#ffffff; --sunken:#f4f8fb; --hover:#f6f6f8; --rail:#ffffff;
  --line:#ececf0; --line-strong:#dededf;
  --ink:#16161a; --ink-soft:#5c5c68; --ink-muted:#8e8e9a; --ink-faint:#b4b4bf;
  --brand:#0a5c9e; --brand-soft:#e8f3fb; --accent:#2e9a46;
  --ok:#15803d; --ok-soft:#e8f6ec; --ok-dot:#22c55e;
  --warn:#b45309; --warn-soft:#fdf3e3; --danger:#b91c1c; --danger-soft:#fdecec;
  --info:#1d4ed8; --info-soft:#ecf0fe;
  --radius:12px;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sn-font:"Source Sans Pro","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;border-color:var(--line)}
html,body{height:100%;margin:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono)}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-muted)}
.scroll{scrollbar-width:thin;scrollbar-color:#dcdce2 transparent}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.rise{animation:rise .18s ease-out both}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pulse{animation:pulse 1.1s ease-in-out infinite}

/* shell */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--surface);padding:0 16px;gap:12px}
.brandmark{display:flex;flex-direction:column;justify-content:center;line-height:1}
.brandmark .row1{display:flex;align-items:center;gap:6px}
.brandmark img{height:22px;width:auto}
.brandmark .aura{font-size:20px;font-weight:700;letter-spacing:-.01em;color:#111}
.brandmark .ct{margin-top:4px;background:#111;color:#fff;border-radius:4px;padding:2px 0 2px .2em;text-align:center;font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.tb-left{display:flex;align-items:center;gap:12px;min-width:0}
.tb-sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.tb-title{font-size:12.5px;font-weight:500;color:var(--ink-soft);white-space:nowrap}
.tb-right{display:flex;align-items:center;gap:4px}
.ghostbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--ink-soft);font-size:12px}
.ghostbtn:hover{background:var(--hover);color:var(--ink)}
.ghostbtn.confirm{background:var(--warn-soft);color:var(--warn);font-weight:600}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:600}
.user{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;font-size:12.5px;font-weight:500}
.body{display:flex;min-height:0;flex:1}
.sidebar{width:252px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--rail);overflow-y:auto;transition:width .15s}
.sidebar.collapsed{width:60px}
.client{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
.client a{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:6px;border-radius:9px}
.client a:hover{background:var(--hover)}
@media (max-width:1600px){.tb-left .pw,.tb-left .tb-sep{display:none!important}}
body{animation:ccfadein .35s ease}@keyframes ccfadein{from{opacity:0}to{opacity:1}}
.cc-logo{height:28px;max-width:100%;width:auto;object-fit:contain;object-position:left}
.sidebar.collapsed .cc-logo{width:34px;height:28px;object-fit:cover;object-position:left}
.p32{width:22px;height:22px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:9.5px;font-weight:600;flex:none}
.client .nm{font-size:13px;font-weight:500;line-height:1.2}
.client .sb{font-size:10.5px;color:var(--ink-muted)}
.iconbtn{width:28px;height:28px;border:0;border-radius:7px;background:transparent;color:var(--ink-faint);display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--hover);color:var(--ink-soft)}
.nav{flex:1;padding:0 8px 16px}
.nav .grp{padding:12px 8px 4px}
.navlink{display:flex;align-items:center;gap:10px;margin-bottom:1px;padding:7px 8px;border-radius:8px;font-size:13px;color:var(--ink-soft)}
.navlink:hover{background:var(--hover);color:var(--ink)}
.navlink.active{background:var(--brand-soft);color:var(--brand);font-weight:500}
.navlink svg{width:15px;height:15px;flex:none;color:var(--ink-muted)}
.navlink.active svg{color:var(--brand)}
.navlink .lbl{flex:1;min-width:0;line-height:1.3}
.navlink .badge{font-size:11px;color:var(--ink-faint)}
.sidebar.collapsed .lbl,.sidebar.collapsed .badge,.sidebar.collapsed .grp,.sidebar.collapsed .client .txt,.sidebar.collapsed .foot span{display:none}
.sidebar.collapsed .navlink{justify-content:center}
.sidebar .foot{border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;font-size:11.5px;line-height:1.35;color:var(--ink-muted)}
.sidebar .foot svg{width:14px;height:14px;flex:none;margin-top:1px}
main{flex:1;min-width:0;overflow-y:auto}
.page{max-width:1400px;margin:0 auto;padding:24px 28px}
@media (max-width:760px){.sidebar{width:60px}.sidebar .lbl,.sidebar .badge,.sidebar .grp,.sidebar .client .txt,.sidebar .foot span{display:none}.navlink{justify-content:center}.tb-title,.hide-sm{display:none}.page{padding:20px 16px}}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:16px 20px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:500;line-height:1.2;white-space:nowrap}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.p-brand{background:var(--brand-soft);color:var(--brand)} .p-info{background:var(--info-soft);color:var(--info)}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:500;white-space:nowrap}
.badge svg{width:12px;height:12px}
.b-good{background:#e8f6ec;color:#0b7a0b} .b-warning{background:#fdf3e3;color:#9a5b00} .b-serious{background:#fdeee6;color:#b4501f}
.b-critical{background:#fdecec;color:#b42318} .b-info{background:var(--hover);color:var(--ink-soft)} .b-running{background:var(--brand-soft);color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:500;white-space:nowrap;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.45}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#2c2c34}
.btn.danger{color:var(--danger);border-color:#f3d3d3}
.btn.danger:hover{background:var(--danger-soft)}
.btn.ghost{border-color:transparent;color:var(--ink-soft)}
.btn.lg{height:36px;font-size:13px}
.mono-chip{font-family:var(--mono);font-size:11.5px;background:var(--sunken);color:var(--ink-soft);border-radius:5px;padding:2px 6px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1180px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g3,.g6{grid-template-columns:1fr}}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1.55fr) minmax(360px,1fr)}
.split.hr{grid-template-columns:minmax(330px,1fr) minmax(0,1.35fr)}
@media (max-width:1180px){.split,.split.hr{grid-template-columns:1fr}}

/* page header */
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.phead h1{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0}
.phead .t{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.phead p{margin:4px 0 0;max-width:820px;font-size:13px;line-height:1.6;color:var(--ink-soft)}
.strip{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-bottom:20px}
@media (max-width:760px){.strip{grid-template-columns:1fr}}
.strip .card{padding:12px 16px}
.strip p{margin:4px 0 0;font-size:12.5px;line-height:1.6;color:var(--ink-soft)}
.simnote{display:flex;gap:6px;align-items:flex-start;margin-top:24px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;line-height:1.6;color:var(--ink-muted)}
.simnote svg{width:14px;height:14px;flex:none;margin-top:2px}
.sec-title{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;margin:0}
.sec-title svg{width:16px;height:16px;color:var(--brand)}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.note-r{font-size:11px;color:var(--ink-muted)}

/* tiles */
.tile{padding:16px 20px}
.tile .h{display:flex;align-items:center;gap:8px}
.tile .h svg{width:13px;height:13px}
.tile .v{margin-top:10px;font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.tile .s{margin-top:8px;font-size:12px;color:var(--ink-muted)}

/* tables */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;padding:8px 16px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);background:var(--sunken);border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}
table.t tr.click:hover{background:var(--hover)}
table.t tr.sel{background:#f3f3fd}
.kv{margin:0}
.kv>div{display:grid;grid-template-columns:minmax(0,150px) 1fr;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.kv>div:last-child{border-bottom:0}
.kv dt{color:var(--ink-muted)}
.kv dd{margin:0;min-width:0}
.input{height:36px;width:100%;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);padding:0 12px;font:inherit;font-size:13px;outline:none}
.input:focus{border-color:var(--brand)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink-faint)}
.search .input{padding-left:34px}
ul.dots{list-style:none;margin:0;padding:0}
ul.dots li{display:flex;gap:8px;margin:4px 0;font-size:12.5px;line-height:1.6;color:var(--ink-soft)}
ul.dots li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink-faint);margin-top:8px;flex:none}
ol.num{list-style:none;margin:0;padding:0;counter-reset:n}
ol.num li{counter-increment:n;display:flex;gap:8px;margin:4px 0;font-size:12.5px;line-height:1.6;color:var(--ink-soft)}
ol.num li::before{content:counter(n) ".";width:16px;text-align:right;flex:none;font-family:var(--mono);font-size:11px;color:var(--ink-muted);padding-top:2px}

/* flow steps */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;list-style:none;margin:0;padding:0}
.flow li{display:flex;align-items:center;gap:6px}
.flow .st{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--ink-muted);background:var(--surface)}
.flow .st .c{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:600;background:var(--hover)}
.flow .st.done{border-color:#cde9d5;background:var(--ok-soft);color:var(--ok)}
.flow .st.done .c{background:var(--ok);color:#fff}
.flow .st.cur{border-color:#b4d2e8;background:var(--brand-soft);color:var(--brand);font-weight:500}
.flow .st.cur .c{background:var(--brand);color:#fff}
.flow .bar{width:12px;height:1px;background:var(--line-strong)}
.progress{height:7px;border-radius:999px;background:var(--hover);overflow:hidden}
.progress>div{height:100%;border-radius:999px;background:var(--brand);transition:width .3s}

/* action rows (agent panel) */
.arow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.arow.done{border-color:#cde9d5;background:#f3fbf5}
.arow .c{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--hover);color:var(--ink-muted);flex:none}
.arow.done .c{background:var(--ok);color:#fff}
.arow .tt{font-size:13px;font-weight:500}
.arow .ss{font-size:11.5px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-steps{list-style:none;margin:0;padding:0}
.agent-steps li{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:12.5px;color:var(--ink-faint)}
.agent-steps li svg{width:15px;height:15px;flex:none;margin-top:1px}
.agent-steps li.done{color:var(--ink)} .agent-steps li.done svg{color:var(--ok)}
.agent-steps li.act{color:var(--brand)}
.agentico{width:36px;height:36px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.agentico svg{width:18px;height:18px}

/* ServiceNow frame */
.sn{overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:#2e2e2e;font-family:var(--sn-font);font-size:13px}
.sn-bar{height:46px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#032d42;color:#fff;padding:0 16px}
.sn-logo{font-size:19px;font-weight:600;letter-spacing:-.02em}
.sn-logo b{color:#62d84e;font-weight:600}
.sn-chip{border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:500}
.sn-inst{background:rgba(255,255,255,.1);border-radius:3px;padding:2px 8px;font-size:11px}
.sn-head{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #d5d9dd;background:#e7eaed;padding:8px 14px}
.sn-head .ttl{font-size:14px;font-weight:600}
.sn-head .crumb{font-size:12px;color:#61707e}
.sn-btn{border:1px solid #b8bfc6;background:#fff;border-radius:3px;padding:4px 12px;font-size:12.5px}
.sn-btn.blue{border-color:#1f6fbd;background:#1f6fbd;color:#fff}
.sn-btn:disabled{opacity:.5}
table.snt{width:100%;min-width:720px;border-collapse:collapse}
table.snt th{text-align:left;padding:6px 12px;font-size:12px;font-weight:600;color:#61707e;border-bottom:1px solid #d5d9dd;white-space:nowrap}
table.snt td{padding:6px 12px;font-size:12.5px;border-bottom:1px solid #eceff1;white-space:nowrap}
table.snt tr:hover{background:#f2f6fa}
table.snt tr.sel{background:#e8f1fb}
.snlink{color:#1f6fbd;border:0;background:none;padding:0}
.snlink:hover{text-decoration:underline}
.sdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
.s-New{background:#8b98a5}.s-InProgress{background:#1f6fbd}.s-OnHold{background:#e5a50a}.s-Resolved{background:#2e8540}
.snform{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:10px 32px}
@media (max-width:760px){.snform{grid-template-columns:1fr}}
.snf{display:flex;align-items:center;gap:12px}
.snf.wide{grid-column:1/-1}
.snf label{width:130px;flex:none;text-align:right;font-size:12.5px;color:#555}
.snf .box{flex:1;min-width:0;height:30px;display:flex;align-items:center;border:1px solid #c8cdd2;border-radius:3px;background:#fff;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .7s,border-color .7s}
.snf .box.flash{border-color:#62d84e;background:#effbea}
.snf.top{align-items:flex-start}
.snf.top label{padding-top:6px}
.snf .area{flex:1;min-height:56px;border:1px solid #c8cdd2;border-radius:3px;padding:6px 8px;line-height:1.6;white-space:normal}
.sntabs{display:flex;gap:4px;border-bottom:1px solid #d5d9dd;padding:0 16px}
.sntab{border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 16px;font-size:13px;color:#555;font-family:var(--sn-font)}
.sntab.on{border-color:#1f6fbd;color:#1f6fbd;font-weight:600}
.act{list-style:none;margin:0;padding:0;flex:1;min-width:0}
.act li{border:1px solid #e1e4e7;border-left:3px solid #c8cdd2;border-radius:3px;background:#fff;padding:8px 12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.act li.wn{border-left-color:#f5c518}
.act li.fresh{box-shadow:0 0 0 2px rgba(98,216,78,.4)}
.act .ah{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:12px}
.act .who{display:flex;align-items:center;gap:8px;font-weight:600}
.act .av{width:22px;height:22px;border-radius:50%;background:#61707e;color:#fff;display:grid;place-items:center;font-size:9.5px;font-weight:600}
.act .av.ai{background:#0a5c9e}
.act .aitag{background:#e8f3fb;color:#0a5c9e;border-radius:2px;padding:1px 6px;font-size:10.5px;font-weight:600}
.act .when{color:#61707e}
.act .txt{margin-top:6px;white-space:pre-wrap;font-size:12.5px;line-height:1.6}
.act table{margin-top:6px;font-size:12px}
.act td{padding:0 16px 0 0}

/* chat */
.chat{height:420px;overflow-y:auto;background:var(--sunken);padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.bub{display:flex;gap:8px;max-width:100%}
.bub.me{flex-direction:row-reverse}
.bub .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--brand);flex:none}
.bub.me .ic{background:var(--ink)}
.bub .ic svg{width:14px;height:14px}
.bub .b{max-width:85%;border-radius:12px;border-top-left-radius:4px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-size:13px;line-height:1.6;white-space:pre-wrap}
.bub.me .b{border-radius:12px;border-top-right-radius:4px;background:var(--ink);color:#fff;border-color:var(--ink)}
.chip{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);border-radius:999px;padding:5px 10px;font-size:12px}
.chip:hover{background:var(--hover)}
.chip.hl{border-color:#b4d2e8;background:var(--brand-soft);color:var(--brand)}

/* control tower */
.agentcard{display:flex;flex-direction:column;padding:16px 20px}
.agentcard .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.agentcard .ico svg{width:17px;height:17px}
